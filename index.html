<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saffrica</title>
<meta name="theme-color" content="#2e4a2a">
<link rel="icon" href="icone.png" type="image/png">
<link rel="apple-touch-icon" href="icone.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root {
  --bg: #f5efe0;
  --card: #fffdf8;
  --ink: #26301f;
  --muted: #6a7060;
  --line: #e3dccb;
  --brand: #2e4a2a;
  --accent: #d9650f;
  --radius: 14px;
  --st-lc: #3a8a4a;
  --st-nt: #7a9a2a;
  --st-vu: #d49a1a;
  --st-en: #d2631f;
  --st-cr: #b3261e;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161a13;
    --card: #1f251b;
    --ink: #ece8da;
    --muted: #a3a794;
    --line: #333b2c;
    --brand: #1f3a1f;
    --accent: #f5882a;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding-bottom: env(safe-area-inset-bottom);
}
.topbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 8px;
  padding: calc(8px + env(safe-area-inset-top)) 12px 8px;
  background: var(--brand); color: #fff;
}
.brand { flex: 1; color: #fff; text-decoration: none; font-weight: 700; font-size: 1.05rem; }
.icon-btn, .lang-btn {
  border: 0; border-radius: 10px; color: #fff; background: rgba(255,255,255,.16);
  min-width: 44px; height: 44px; font-size: 1.1rem; font-weight: 700; cursor: pointer;
}
.icon-btn { font-size: 1.8rem; line-height: 1; }
main { max-width: 760px; margin: 0 auto; padding: 16px 14px 24px; outline: none; }
h1 { font-size: 1.4rem; margin: 4px 0 4px; }
h2 { font-size: 1.1rem; margin: 0 0 8px; }
.lead { color: var(--muted); margin: 0 0 12px; }
.search {
  width: 100%; padding: 12px 14px; margin: 4px 0 14px; font-size: 1rem;
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--card); color: var(--ink);
}
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  width: 100%; padding: 14px 16px; text-align: left;
  background: var(--card); color: var(--ink); text-decoration: none;
  border: 1px solid var(--line); border-radius: var(--radius); font-size: 1rem;
}
a.row:active { transform: scale(.99); }
.row .chev { color: var(--muted); font-size: 1.3rem; }
.row.disabled { opacity: .55; }
.pill {
  font-size: .72rem; padding: 2px 8px; border-radius: 999px;
  background: var(--line); color: var(--muted); white-space: nowrap;
}
.pill.ok { background: #dcebd2; color: #26501d; }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 560px) { .grid { grid-template-columns: repeat(3, 1fr); } }
.tile {
  display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;
  padding: 16px 8px; text-decoration: none; color: var(--ink);
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
}
.tile .emoji { font-size: 2.2rem; }
.tile .nm { font-weight: 600; font-size: .95rem; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 16px; margin: 0 0 12px;
}
.card.park { border-left: 5px solid var(--accent); }
.hero { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.hero .emoji { font-size: 3rem; }
.sci { font-style: italic; color: var(--muted); margin: 0; }
.badge {
  display: inline-block; padding: 3px 10px; border-radius: 999px;
  color: #fff; font-size: .8rem; font-weight: 700;
}
.badge.LC { background: var(--st-lc); }
.badge.NT { background: var(--st-nt); }
.badge.VU { background: var(--st-vu); }
.badge.EN { background: var(--st-en); }
.badge.CR { background: var(--st-cr); }
.big { font-size: 1.15rem; font-weight: 700; margin: 2px 0 6px; }
.meta { color: var(--muted); font-size: .88rem; margin: 4px 0; }
.note { font-size: .92rem; margin: 8px 0 0; }
.conf {
  display: inline-block; font-size: .75rem; padding: 2px 8px; border-radius: 8px; margin-right: 6px;
  border: 1px solid var(--line); color: var(--muted);
}
.conf.official { border-color: #3a8a4a; color: #3a8a4a; }
.conf.scientific { border-color: #2f6fb0; color: #2f6fb0; }
.conf.unofficial { border-color: var(--st-en); color: var(--st-en); }
.conf.none { border-color: var(--st-cr); color: var(--st-cr); }
dl.facts { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; }
dl.facts dt { color: var(--muted); font-size: .9rem; }
dl.facts dd { margin: 0; }
.sources { margin: 8px 0 0; padding-left: 18px; font-size: .85rem; color: var(--muted); }
.sources a { color: var(--accent); overflow-wrap: anywhere; }
details summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
.warn {
  background: #fff4dc; color: #5a3d00; border: 1px solid #f0d9a0;
  border-radius: var(--radius); padding: 10px 14px; font-size: .88rem; margin: 0 0 12px;
}
@media (prefers-color-scheme: dark) { .warn { background: #3a2f12; color: #f3dfa8; border-color: #5a4a1d; } }
.footer { max-width: 760px; margin: 0 auto; padding: 0 14px 28px; color: var(--muted); font-size: .82rem; text-align: center; }
.footer a { color: var(--accent); }
.empty { color: var(--muted); text-align: center; padding: 20px 0; }
.upd { border-left: 4px solid var(--accent); }
.upd time { color: var(--muted); font-size: .82rem; }

.brand { letter-spacing: .02em; font-size: 1.25rem; }
.brand::before { content: ''; display: inline-block; width: 22px; height: 22px; margin-right: 8px; vertical-align: -4px; border-radius: 50%; background: #e8a63c; box-shadow: inset 0 -8px 0 #f57a1a33; }


/* --- v1.1 : photos, jauge, cartes d'information identiques --- */
.photo { position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: #2e4a2a; }
.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.photo .ph { position: absolute; inset: 0; display: grid; place-items: center; font-size: 2.4rem; font-weight: 800; color: #e8a63c;
  background: radial-gradient(circle at 50% 62%, rgba(232,166,60,.28) 0 42%, transparent 43%), #2e4a2a; }
.hero-photo { margin-bottom: 4px; }
.credit { margin: 0 0 8px; font-size: .75rem; color: var(--muted); text-align: right; }
.tile .photo { margin-bottom: 8px; }
.tile .gauge { margin-top: 6px; }
.gauge { display: inline-flex; gap: 3px; vertical-align: middle; }
.gauge i { display: block; width: 26px; height: 10px; border-radius: 3px; }
.gauge i.off { background: var(--line); }
.gauge.sm i { width: 14px; height: 6px; }
.gauge.lg { display: flex; gap: 4px; }
.gauge.lg i { flex: 1; width: auto; height: 16px; border-radius: 4px; }
.scale { display: flex; justify-content: space-between; font-size: .76rem; color: var(--muted); margin: 4px 0 8px; }
.chips { margin: 0 0 6px; }
.chip { display: inline-block; font-size: .8rem; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); margin: 0 6px 6px 0; }
.chip.official { border-color: #3a8a4a; color: #3a8a4a; }
.chip.scientific { border-color: #2f6fb0; color: #2f6fb0; }
.chip.unofficial { border-color: #d2631f; color: #d2631f; }
.chip.none { border-color: #b3261e; color: #b3261e; }
.chip.cty { color: var(--ink); }
.chip.cty.app { border-color: #3a8a4a; color: #3a8a4a; font-weight: 700; text-decoration: none; }
.chip.cty.back { border-color: #2f6fb0; color: #2f6fb0; }
.chip.cty.gone { border-style: dashed; opacity: .8; }
.rh { font-size: .92rem; margin: 12px 0 4px; }
.chip.LC, .chip.NT, .chip.VU, .chip.EN, .chip.CR { color: #fff; border-color: transparent; font-weight: 700; }
.chip.LC { background: #3a8a4a; } .chip.NT { background: #8aa62a; } .chip.VU { background: #d49a1a; }
.chip.EN { background: #d2631f; } .chip.CR { background: #b3261e; }
.badge.NT { background: #8aa62a; }
.info { border-left: 5px solid var(--accent); }
.info.world { border-left-color: var(--brand); }
.info .fig { font-size: 1.15rem; font-weight: 700; margin: 2px 0 8px; }
.info .meta { margin: 4px 0 6px; }
.legend { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 12px; }
.legend li { display: flex; gap: 12px; align-items: center; }
.legend .gauge { flex: none; }
.legend strong { display: block; }
.legend .t { display: block; font-size: .86rem; color: var(--muted); }
.lvl { margin: 0 0 8px; }

/* --- v1.3 : comment le reconnaître --- */
.recog { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.recog h3 { font-size: 1rem; margin: 0 0 6px; }
.recog p { margin: 0 0 10px; }
.sexes { display: grid; gap: 8px; grid-template-columns: 1fr; }
@media (min-width: 560px) { .sexes { grid-template-columns: 1fr 1fr; } .sexes .sx.both { grid-column: 1 / -1; } }
.sx { border: 1px solid var(--line); border-left-width: 5px; border-radius: 10px; padding: 8px 12px; background: var(--bg); }
.sx strong { display: block; font-size: .85rem; }
.sx span { font-size: .92rem; }
.sx.m { border-left-color: #2f6fb0; }
.sx.f { border-left-color: #c2527a; }
.sx.both { border-left-color: var(--muted); }
</style>
</head>
<body>
<header class="topbar">
  <button id="backBtn" class="icon-btn" aria-label="Retour" hidden>‹</button>
  <a href="#/" class="brand" id="brand">Saffrica</a>
  <button id="langBtn" class="lang-btn" aria-label="Langue">EN</button>
</header>
<main id="app" tabindex="-1"></main>
<footer class="footer" id="footer"></footer>

<!-- Les données (pays, parcs, animaux, chiffres, sources) sont dans donnees.js, au même endroit que ce fichier -->
<script src="donnees.js"></script>
<script src="images.js"></script>
<script>
(function () {
  "use strict";
  var D = window.APP_DATA;
  if (!D) {
    document.getElementById("app").innerHTML = '<div class="card"><h2>Fichier manquant</h2><p>Mets <strong>index.html</strong> et <strong>donnees.js</strong> dans le même dossier, puis rouvre index.html.</p></div>';
    return;
  }
  var app = document.getElementById("app");
  var footer = document.getElementById("footer");
  var backBtn = document.getElementById("backBtn");
  var langBtn = document.getElementById("langBtn");
  var brand = document.getElementById("brand");

  /* ---------- UI strings ---------- */
  var UI = {
    en: {
      title: "Saffrica",
      pickCountry: "Choose a country",
      pickCountryLead: "Step 1 of 4. Start by picking the country you are in.",
      search: "Search…",
      soon: "Coming soon",
      parks: "Parks",
      pickPark: "Choose a park",
      pickParkLead: "Step 2 of 4. Pick the park you are visiting.",
      noParks: "No parks added yet for this country.",
      pickAnimal: "Choose an animal",
      pickAnimalLead: "Step 3 of 4. Tap an animal to see its details.",
      noResults: "Nothing found.",
      inPark: "In this park",
      worldwide: "Worldwide",
      about: "About this animal",
      diet: "Diet",
      size: "Size",
      lifespan: "Lifespan",
      behavior: "Behaviour",
      spot: "Where and when to see it",
      safety: "Safety",
      status: "Conservation status",
      trend: "Trend",
      asOf: "Data from",
      estAge: "Estimate date",
      moreNews: "Related news",
      sources: "Sources",
      parkAbout: "About the park",
      bestTime: "Best time to visit",
      whatsNew: "What’s new",
      back: "Back",
      checked: "Data last checked",
      next: "Next update planned",
      offlineReady: "Ready to use offline",
      offlineNo: "Offline mode not ready yet",
      disclaimer: "Figures are estimates, not exact counts, and each one shows its source and date. Descriptions (diet, size, lifespan, behaviour, safety) are general reference knowledge. Always follow park rules and rangers’ advice.",
      stepNote: "Step 4 of 4",
      dataDate: "Data date",
      illustration: "Illustration",
      searchAll: "Search an animal, a park or a country…",
      animalsLbl: "Animals",
      whereLives: "Where it lives",
      rPresent: "Present",
      rBack: "Reintroduced",
      rGone: "Gone or uncertain",
      rGeneric: "In a country, the species can be rare or found only in some areas. Countries in green are in the app: tap to open.",
      inApp: "Where to see it in the app",
      animalSheet: "Animal profile",
      seeHere: "See its page in this park",
      recognize: "How to recognise it",
      male: "Male",
      female: "Female",
      bothSexes: "Male and female",
      gaugeTitle: "How to read the gauge",
      gaugeIntro: "The fuller and redder the gauge, the more the species is threatened with disappearing (IUCN Red List scale). So “Near Threatened” is LESS serious than “Vulnerable”.",
      gaugeLess: "Less threatened",
      gaugeMore: "More threatened",
      conf: {
        official: "Official figure (SANParks)",
        scientific: "Scientific / Red List",
        unofficial: "Unofficial source",
        none: "No recent figure"
      },
      soonText: "Not available yet",
      updatesLead: "Data changes and wildlife news added to the app, newest first."
    },
    fr: {
      title: "Saffrica",
      pickCountry: "Choisissez un pays",
      pickCountryLead: "Étape 1 sur 4. Commencez par choisir le pays où vous êtes.",
      search: "Rechercher…",
      soon: "Bientôt",
      parks: "Parcs",
      pickPark: "Choisissez un parc",
      pickParkLead: "Étape 2 sur 4. Choisissez le parc que vous visitez.",
      noParks: "Aucun parc ajouté pour ce pays pour l’instant.",
      pickAnimal: "Choisissez un animal",
      pickAnimalLead: "Étape 3 sur 4. Touchez un animal pour voir ses détails.",
      noResults: "Aucun résultat.",
      inPark: "Dans ce parc",
      worldwide: "Dans le monde",
      about: "À propos de cet animal",
      diet: "Alimentation",
      size: "Taille",
      lifespan: "Durée de vie",
      behavior: "Comportement",
      spot: "Où et quand l’observer",
      safety: "Sécurité",
      status: "Statut de conservation",
      trend: "Tendance",
      asOf: "Données de",
      estAge: "Date de l’estimation",
      moreNews: "Actualités liées",
      sources: "Sources",
      parkAbout: "À propos du parc",
      bestTime: "Meilleure période",
      whatsNew: "Nouveautés",
      back: "Retour",
      checked: "Dernière vérification des données",
      next: "Prochaine mise à jour prévue",
      offlineReady: "Utilisable hors ligne",
      offlineNo: "Mode hors ligne pas encore prêt",
      disclaimer: "Les chiffres sont des estimations, pas des comptages exacts, et chacun indique sa source et sa date. Les descriptions (alimentation, taille, durée de vie, comportement, sécurité) sont des connaissances générales de référence. Respectez toujours les règles du parc et les conseils des rangers.",
      stepNote: "Étape 4 sur 4",
      dataDate: "Date des données",
      illustration: "Illustration",
      searchAll: "Chercher un animal, un parc ou un pays…",
      animalsLbl: "Animaux",
      whereLives: "Où il vit",
      rPresent: "Présent",
      rBack: "Réintroduit",
      rGone: "Disparu ou incertain",
      rGeneric: "Dans un pays, l’espèce peut être rare ou présente seulement dans certaines zones. Les pays en vert sont dans l’application : touchez pour les ouvrir.",
      inApp: "Où le voir dans l’application",
      animalSheet: "Fiche de l’animal",
      seeHere: "Voir sa fiche dans ce parc",
      recognize: "Comment le reconnaître",
      male: "Mâle",
      female: "Femelle",
      bothSexes: "Mâle et femelle",
      gaugeTitle: "Comprendre la jauge",
      gaugeIntro: "Plus la jauge est remplie et rouge, plus l’espèce est menacée de disparition (échelle de la Liste rouge de l’UICN). Donc « Quasi menacée » est MOINS grave que « Vulnérable ».",
      gaugeLess: "Moins menacé",
      gaugeMore: "Plus menacé",
      conf: {
        official: "Chiffre officiel (SANParks)",
        scientific: "Scientifique / Liste rouge",
        unofficial: "Source non officielle",
        none: "Aucun chiffre récent"
      },
      soonText: "Pas encore disponible",
      updatesLead: "Modifications des données et actualités ajoutées à l’application, les plus récentes d’abord."
    }
  };

  var lang = "fr";
  try {
    var saved = localStorage.getItem("awf-lang");
    if (saved === "en" || saved === "fr") lang = saved;
    
  } catch (e) {}

  var offlineReady = false;

  /* ---------- helpers ---------- */
  function T() { return UI[lang]; }
  function tr(o) { if (typeof o === "string") return o; return o ? (o[lang] || o.en || "") : ""; }
  var FR_MONTHS = { Jan: "janv.", Feb: "févr.", Mar: "mars", Apr: "avr.", May: "mai", Jun: "juin", Jul: "juil.", Aug: "août", Sep: "sept.", Oct: "oct.", Nov: "nov.", Dec: "déc." };
  function looseDate(s) {
    s = tr(s);
    if (lang !== "fr") return s;
    return s.replace(/\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\b/g, function (m) { return FR_MONTHS[m]; });
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function fmtDate(iso) {
    var p = iso.split("-");
    var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] || 1));
    try {
      return d.toLocaleDateString(lang === "fr" ? "fr-FR" : "en-GB",
        { day: "numeric", month: "long", year: "numeric", timeZone: "UTC" });
    } catch (e) { return iso; }
  }
  function countryName(c) { return c[lang] || c.en; }
  function findCountry(id) { return D.countries.filter(function (c) { return c.id === id; })[0]; }
  function findPark(id) { return D.parks.filter(function (p) { return p.id === id; })[0]; }
  function norm(s) {
    return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  }
  function sourceList(ids) {
    if (!ids || !ids.length) return "";
    var items = ids.map(function (id) {
      var s = D.sources[id];
      if (!s) return "";
      return '<li><a href="' + esc(s.url) + '" target="_blank" rel="noopener noreferrer">' + esc(s.title) +
        "</a> — " + esc(s.publisher) + ", " + esc(looseDate(s.date)) + "</li>";
    }).join("");
    return '<ul class="sources">' + items + "</ul>";
  }
  function uniq(arr) {
    var out = [];
    arr.forEach(function (x) { if (x && out.indexOf(x) < 0) out.push(x); });
    return out;
  }

  var GCOL = ["#3a8a4a", "#8aa62a", "#d49a1a", "#d2631f", "#b3261e"];
  var LEVEL = { LC: 1, NT: 2, VU: 3, EN: 4, CR: 5 };
  var CODES = ["LC", "NT", "VU", "EN", "CR"];
  function gauge(code, size) {
    var n = LEVEL[code] || 0, cells = "";
    for (var i = 0; i < 5; i++) {
      cells += i < n ? '<i style="background:' + GCOL[i] + '"></i>' : '<i class="off"></i>';
    }
    return '<span class="gauge ' + (size || "") + '" role="img" aria-label="' + esc(tr(D.status[code])) + " (" + n + "/5)" + '">' + cells + "</span>";
  }
  function photo(a, cls) {
    var letter = esc(tr(a.name).charAt(0));
    var src = a.img ? ((window.APP_IMAGES && window.APP_IMAGES[a.img]) || a.img) : "";
    var img = a.img ? '<img src="' + esc(src) + '" alt="' + esc(tr(a.name)) + '" loading="lazy" onerror="this.remove()">' : "";
    return '<span class="photo ' + (cls || "") + '"><span class="ph" aria-hidden="true">' + letter + "</span>" + img + "</span>";
  }
  function recogBlock(a) {
    if (!a.recognize) return "";
    var sexes = a.noDiff
      ? '<div class="sx both"><strong>' + esc(T().bothSexes) + "</strong><span>" + esc(tr(a.noDiff)) + "</span></div>"
      : '<div class="sx m"><strong>' + esc(T().male) + "</strong><span>" + esc(tr(a.male)) + "</span></div>" +
        '<div class="sx f"><strong>' + esc(T().female) + "</strong><span>" + esc(tr(a.female)) + "</span></div>";
    return '<div class="recog"><h3>' + esc(T().recognize) + "</h3><p>" + esc(tr(a.recognize)) + '</p><div class="sexes">' + sexes + "</div></div>";
  }
  function chip(text, cls) { return '<span class="chip ' + (cls || "") + '">' + esc(text) + "</span>"; }
  function infoCard(kind, title, fig, chips, date, note, extra) {
    return '<section class="card info ' + kind + '"><h2>' + esc(title) + '</h2><p class="fig">' + esc(fig) + "</p>" +
      '<p class="chips">' + chips + "</p>" +
      '<p class="meta">' + esc(T().dataDate) + ": " + esc(date) + "</p>" +
      (note ? '<p class="note">' + esc(note) + "</p>" : "") +
      (extra ? '<p class="note"><strong>' + esc(T().moreNews) + ":</strong> " + esc(extra) + "</p>" : "") +
      "</section>";
  }
  function legendCard() {
    var rows = CODES.map(function (c) {
      return "<li>" + gauge(c) + "<div><strong>" + esc(tr(D.status[c])) + '</strong><span class="t">' + esc(tr(D.gauge[c].text)) + "</span></div></li>";
    }).join("");
    return '<section class="card"><h2>' + esc(T().gaugeTitle) + '</h2><p class="meta">' + esc(T().gaugeIntro) + "</p>" +
      '<div class="scale"><span>' + esc(T().gaugeLess) + "</span><span>" + esc(T().gaugeMore) + "</span></div>" +
      '<ul class="legend">' + rows + "</ul></section>";
  }

  function rangeCard(aid) {
    var r = D.ranges && D.ranges[aid];
    if (!r) return "";
    var html = '<section class="card range"><h2>' + esc(T().whereLives) + "</h2>";
    if (r.text) html += "<p>" + esc(tr(r.text)) + "</p>";
    [["present", "rPresent", ""], ["back", "rBack", "back"], ["gone", "rGone", "gone"]].forEach(function (g) {
      var ids = r[g[0]];
      if (!ids || !ids.length) return;
      var list = ids.map(findCountry).filter(Boolean).sort(function (a, b) { return countryName(a).localeCompare(countryName(b), lang); });
      html += '<h3 class="rh">' + esc(T()[g[1]]) + " (" + list.length + ')</h3><p class="chips">' + list.map(function (c) {
        return c.available
          ? '<a class="chip cty app" href="#/c/' + c.id + '">' + esc(countryName(c)) + "</a>"
          : '<span class="chip cty ' + g[2] + '">' + esc(countryName(c)) + "</span>";
      }).join("") + "</p>";
    });
    html += '<p class="meta">' + esc(T().dataDate) + ": " + esc(looseDate(tr(r.asOf))) + "</p>";
    if (r.note) html += '<p class="note">' + esc(tr(r.note)) + "</p>";
    if (r.present || r.back || r.gone) html += '<p class="meta">' + esc(T().rGeneric) + "</p>";
    return html + "</section>";
  }
  function parksWith(aid) {
    return D.parks.filter(function (p) { return p.animals.indexOf(aid) >= 0; });
  }

  /* ---------- views ---------- */
  function viewCountries() {
    var list = D.countries.slice().sort(function (a, b) {
      var av = a.available ? 0 : 1, bv = b.available ? 0 : 1;
      if (av !== bv) return av - bv;
      return countryName(a).localeCompare(countryName(b), lang);
    });
    var html = "<h1>" + esc(T().pickCountry) + '</h1><p class="lead">' + esc(T().pickCountryLead) + "</p>" +
      '<input class="search" id="q" type="search" placeholder="' + esc(T().searchAll) + '" autocomplete="off">' +
      '<div id="res" hidden></div>' +
      '<ul class="list" id="items">' +
      list.map(function (c) {
        var name = esc(countryName(c));
        if (c.available) {
          return '<li data-k="' + esc(norm(c.en + " " + c.fr)) + '"><a class="row" href="#/c/' + c.id + '"><span>' + name +
            '</span><span class="chev">›</span></a></li>';
        }
        return '<li data-k="' + esc(norm(c.en + " " + c.fr)) + '"><div class="row disabled" aria-disabled="true"><span>' + name +
          '</span><span class="pill">' + esc(T().soon) + "</span></div></li>";
      }).join("") + "</ul>" +
      '<p class="empty" id="none" hidden>' + esc(T().noResults) + "</p>";
    return { html: html, after: bindHome };
  }

  function homeResults(v) {
    var animals = Object.keys(D.animals).filter(function (k) {
      var a = D.animals[k];
      return norm(a.name.en + " " + a.name.fr + " " + a.sci).indexOf(v) >= 0;
    }).sort(function (x, y) {
      var nx = norm(tr(D.animals[x].name)).indexOf(v) === 0 ? 0 : 1, ny = norm(tr(D.animals[y].name)).indexOf(v) === 0 ? 0 : 1;
      return nx - ny || tr(D.animals[x].name).localeCompare(tr(D.animals[y].name), lang);
    });
    var parks = D.parks.filter(function (p) {
      var c = findCountry(p.country) || {};
      return norm(p.name.en + " " + p.name.fr + " " + tr(p.region) + " " + (c.en || "") + " " + (c.fr || "")).indexOf(v) >= 0;
    });
    var html = "";
    if (parks.length) {
      html += "<h2>" + esc(T().parks) + '</h2><ul class="list">' + parks.map(function (p) {
        var c = findCountry(p.country);
        return '<li><a class="row" href="#/p/' + p.id + '"><span><strong>' + esc(tr(p.name)) + '</strong><br><small class="meta">' +
          esc(c ? countryName(c) : "") + " · " + esc(tr(p.region)) + '</small></span><span class="chev">›</span></a></li>';
      }).join("") + "</ul>";
    }
    if (animals.length) {
      html += "<h2>" + esc(T().animalsLbl) + '</h2><ul class="list">' + animals.map(function (k) {
        var a = D.animals[k];
        return '<li><a class="row" href="#/a/' + k + '"><span><strong>' + esc(tr(a.name)) + '</strong><br><small class="meta">' +
          esc(a.sci) + '</small></span><span class="badge ' + a.status + '">' + esc(tr(D.status[a.status])) + "</span></a></li>";
      }).join("") + "</ul>";
    }
    return html;
  }

  function bindHome() {
    var q = document.getElementById("q");
    if (!q) return;
    var res = document.getElementById("res");
    q.addEventListener("input", function () {
      var v = norm(q.value.trim());
      var shown = 0;
      Array.prototype.forEach.call(document.querySelectorAll("#items > li"), function (li) {
        var ok = !v || li.getAttribute("data-k").indexOf(v) >= 0;
        li.hidden = !ok;
        if (ok) shown++;
      });
      var html = v ? homeResults(v) : "";
      res.innerHTML = html;
      res.hidden = !html;
      var none = document.getElementById("none");
      if (none) none.hidden = shown > 0 || !!html;
    });
  }

  function bindFilter() {
    var q = document.getElementById("q");
    if (!q) return;
    q.addEventListener("input", function () {
      var v = norm(q.value.trim());
      var shown = 0;
      Array.prototype.forEach.call(document.querySelectorAll("#items > li"), function (li) {
        var ok = !v || li.getAttribute("data-k").indexOf(v) >= 0;
        li.hidden = !ok;
        if (ok) shown++;
      });
      var none = document.getElementById("none");
      if (none) none.hidden = shown > 0;
    });
  }

  function viewCountry(id) {
    var c = findCountry(id);
    if (!c) return viewCountries();
    var parks = D.parks.filter(function (p) { return p.country === id; });
    var html = "<h1>" + esc(countryName(c)) + "</h1>";
    if (!parks.length) {
      html += '<p class="lead">' + esc(T().noParks) + "</p>";
      return { html: html };
    }
    html += '<p class="lead">' + esc(T().pickParkLead) + "</p>" +
      '<ul class="list">' + parks.map(function (p) {
        return '<li><a class="row" href="#/p/' + p.id + '"><span><strong>' + esc(tr(p.name)) + "</strong><br><small class=\"meta\">" +
          esc(tr(p.region)) + '</small></span><span class="chev">›</span></a></li>';
      }).join("") + "</ul>";
    return { html: html };
  }

  function viewPark(id) {
    var p = findPark(id);
    if (!p) return viewCountries();
    var facts = p.facts.map(function (f) {
      return "<dt>" + esc(tr(f.label)) + "</dt><dd>" + esc(tr(f.value)) + "</dd>";
    }).join("");
    var tiles = p.animals.map(function (aid) {
      var a = D.animals[aid];
      return '<a class="tile" data-k="' + esc(norm(a.name.en + " " + a.name.fr + " " + a.sci)) + '" href="#/p/' + p.id + "/a/" + aid + '">' +
        photo(a) + '<span class="nm">' + esc(tr(a.name)) + "</span>" +
        '<span class="badge ' + a.status + '">' + esc(tr(D.status[a.status])) + "</span>" + gauge(a.status, "sm") + "</a>";
    }).join("");
    var html = "<h1>" + esc(tr(p.name)) + '</h1><p class="meta">' + esc(tr(p.region)) + "</p>" +
      '<div class="card park"><p style="margin:0 0 8px">' + esc(tr(p.about)) + "</p>" +
      '<dl class="facts">' + facts + "</dl>" +
      '<p class="note"><strong>' + esc(T().bestTime) + ":</strong> " + esc(tr(p.bestTime)) + "</p>" +
      "<details><summary>" + esc(T().sources) + "</summary>" + sourceList(p.sources) + "</details></div>" +
      "<h2>" + esc(T().pickAnimal) + '</h2><p class="lead">' + esc(T().pickAnimalLead) + "</p>" +
      '<input class="search" id="q" type="search" placeholder="' + esc(T().search) + '" autocomplete="off">' +
      '<div class="grid" id="items">' + tiles + "</div>" +
      '<p class="empty" id="none" hidden>' + esc(T().noResults) + "</p>" +
      legendCard();
    return {
      html: html,
      after: function () {
        var q = document.getElementById("q");
        q.addEventListener("input", function () {
          var v = norm(q.value.trim());
          var shown = 0;
          Array.prototype.forEach.call(document.querySelectorAll("#items > a"), function (el) {
            var ok = !v || el.getAttribute("data-k").indexOf(v) >= 0;
            el.hidden = !ok;
            if (ok) shown++;
          });
          document.getElementById("none").hidden = shown > 0;
        });
      }
    };
  }

  function viewAnimal(pid, aid) {
    var p = pid ? findPark(pid) : null;
    var a = D.animals[aid];
    var pa = p && D.parkAnimals[pid] && D.parkAnimals[pid][aid];
    if (!a || (pid && (!p || !pa))) return viewCountries();

    var html = photo(a, "hero-photo") + (a.img ? '<p class="credit">' + esc(T().illustration) + "</p>" : "") + '<h1 style="margin:0">' + esc(tr(a.name)) + '</h1><p class="sci">' + esc(a.sci) + "</p>" +
      '<p class="meta">' + (p ? esc(tr(p.name)) + " · " + esc(T().stepNote) : esc(T().animalSheet)) + "</p>";

    /* 1. Infos générales sur l'animal (en haut) */
    html += '<section class="card"><h2>' + esc(T().about) + '</h2><dl class="facts">' +
      "<dt>" + esc(T().diet) + "</dt><dd>" + esc(tr(a.diet)) + "</dd>" +
      "<dt>" + esc(T().size) + "</dt><dd>" + esc(tr(a.size)) + "</dd>" +
      "<dt>" + esc(T().lifespan) + "</dt><dd>" + esc(tr(a.lifespan)) + "</dd>" +
      "<dt>" + esc(T().behavior) + "</dt><dd>" + esc(tr(a.behavior)) + "</dd>" +
      "</dl>" + recogBlock(a) + "</section>";

    /* 2. Dans ce parc  /  3. Dans le monde : exactement la même mise en page */
    if (pa) html += infoCard("park", T().inPark, tr(pa.pop),
      chip(T().conf[pa.conf], pa.conf) + (pa.trend ? chip(T().trend + ": " + tr(pa.trend)) : ""),
      looseDate(tr(pa.asOf)), tr(pa.note), pa.extra ? tr(pa.extra) : "");
    html += infoCard("world", T().worldwide, tr(a.global.pop),
      chip(tr(D.status[a.status]), a.status) + (a.global.trend ? chip(T().trend + ": " + tr(a.global.trend)) : ""),
      looseDate(a.global.asOf), tr(a.global.note), "");

    /* 4. Jauge de menace */
    html += '<section class="card"><h2>' + esc(T().status) + "</h2>" +
      '<p class="lvl"><span class="badge ' + a.status + '">' + esc(tr(D.status[a.status])) + "</span></p>" +
      gauge(a.status, "lg") +
      '<div class="scale"><span>' + esc(T().gaugeLess) + "</span><span>" + esc(T().gaugeMore) + "</span></div>" +
      '<p class="note">' + esc(tr(D.gauge[a.status].text)) + "</p>" +
      '<p class="meta">' + esc(tr(a.statusAsOf)) + "</p></section>";

    /* 5. Pays, parcs de l'application, où voir, sécurité, sources */
    html += rangeCard(aid);
    if (!p) {
      html += '<section class="card"><h2>' + esc(T().inApp) + '</h2><ul class="list">' + parksWith(aid).map(function (pk) {
        var c = findCountry(pk.country);
        return '<li><a class="row" href="#/p/' + pk.id + "/a/" + aid + '"><span><strong>' + esc(tr(pk.name)) + '</strong><br><small class="meta">' +
          esc(c ? countryName(c) : "") + " · " + esc(T().seeHere) + '</small></span><span class="chev">›</span></a></li>';
      }).join("") + "</ul></section>";
    }
    if (pa) html += '<section class="card"><h2>' + esc(T().spot) + "</h2><p>" + esc(tr(pa.spot)) + "</p>" +
      '<p class="meta">' + esc(tr(p.bestTime)) + "</p></section>";
    html += '<section class="card"><h2>' + esc(T().safety) + "</h2><p>" + esc(tr(a.safety)) + "</p></section>";

    var rg = (D.ranges && D.ranges[aid] && D.ranges[aid].src) || [];
    var allSrc = uniq(((pa && pa.src) || []).concat((pa && pa.extraSrc) || [], (pa && pa.growthSrc) || [], (pa && pa.spotSrc) || [], a.global.src || [], a.statusSrc || [], rg));
    html += '<section class="card"><h2>' + esc(T().sources) + "</h2>" + sourceList(allSrc) + "</section>";
    html += '<div class="warn">' + esc(T().disclaimer) + "</div>";
    return { html: html };
  }

  function viewNews() {
    var html = "<h1>" + esc(T().whatsNew) + '</h1><p class="lead">' + esc(T().updatesLead) + "</p>" +
      D.updates.map(function (u) {
        return '<article class="card upd"><time datetime="' + esc(u.date) + '">' + esc(fmtDate(u.date)) + "</time>" +
          "<h2>" + esc(tr(u.title)) + "</h2><p>" + esc(tr(u.text)) + "</p>" + sourceList(u.src) + "</article>";
      }).join("");
    return { html: html };
  }

  /* ---------- router ---------- */
  function parse() {
    var h = (location.hash || "#/").replace(/^#\/?/, "");
    var parts = h.split("/").filter(Boolean);
    return parts;
  }

  function parentHash(parts) {
    if (parts[0] === "a") return "#/";
    if (parts[0] === "p" && parts[2] === "a") return "#/p/" + parts[1];
    if (parts[0] === "p") {
      var p = findPark(parts[1]);
      return p ? "#/c/" + p.country : "#/";
    }
    return "#/";
  }

  function render() {
    var parts = parse();
    var view;
    if (parts[0] === "c" && parts[1]) view = viewCountry(parts[1]);
    else if (parts[0] === "a" && parts[1]) view = viewAnimal(null, parts[1]);
    else if (parts[0] === "p" && parts[1] && parts[2] === "a" && parts[3]) view = viewAnimal(parts[1], parts[3]);
    else if (parts[0] === "p" && parts[1]) view = viewPark(parts[1]);
    else if (parts[0] === "news") view = viewNews();
    else view = viewCountries();

    app.innerHTML = view.html;
    if (view.after) view.after();

    var atHome = parts.length === 0;
    backBtn.hidden = atHome;
    backBtn.onclick = function () { location.hash = parentHash(parts); };
    backBtn.setAttribute("aria-label", T().back);

    document.documentElement.lang = lang;
    document.title = T().title;
    brand.textContent = T().title;
    langBtn.textContent = lang === "en" ? "FR" : "EN";
    langBtn.setAttribute("aria-label", lang === "en" ? "Passer en français" : "Switch to English");

    footer.innerHTML =
      '<p><a href="#/news">' + esc(T().whatsNew) + "</a></p>" +
      "<p>" + esc(T().checked) + ": " + esc(fmtDate(D.meta.lastChecked)) + " · " + esc(T().next) + ": " + esc(fmtDate(D.meta.nextUpdate)) + "</p>";

    window.scrollTo(0, 0);
  }

  langBtn.addEventListener("click", function () {
    lang = lang === "en" ? "fr" : "en";
    try { localStorage.setItem("awf-lang", lang); } catch (e) {}
    render();
  });
  window.addEventListener("hashchange", render);

  render();
})();

</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
</body>
</html>
