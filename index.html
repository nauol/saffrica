<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saffrica</title>
<meta name="theme-color" content="#2e4a2a">
<link rel="icon" href="icone.png" type="image/png">
<link rel="apple-touch-icon" href="icone.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root {
  --bg: #f5efe0;
  --card: #fffdf8;
  --ink: #26301f;
  --muted: #6a7060;
  --line: #e3dccb;
  --brand: #2e4a2a;
  --accent: #d9650f;
  --radius: 14px;
  --st-lc: #3a8a4a;
  --st-nt: #7a9a2a;
  --st-vu: #d49a1a;
  --st-en: #d2631f;
  --st-cr: #b3261e;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161a13;
    --card: #1f251b;
    --ink: #ece8da;
    --muted: #a3a794;
    --line: #333b2c;
    --brand: #1f3a1f;
    --accent: #f5882a;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding-bottom: env(safe-area-inset-bottom);
}
.topbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 8px;
  padding: calc(8px + env(safe-area-inset-top)) 12px 8px;
  background: var(--brand); color: #fff;
}
.brand { flex: 1; color: #fff; text-decoration: none; font-weight: 700; font-size: 1.05rem; }
.icon-btn, .lang-btn {
  border: 0; border-radius: 10px; color: #fff; background: rgba(255,255,255,.16);
  min-width: 44px; height: 44px; font-size: 1.1rem; font-weight: 700; cursor: pointer;
}
.icon-btn { font-size: 1.8rem; line-height: 1; }
main { max-width: 760px; margin: 0 auto; padding: 16px 14px 24px; outline: none; }
h1 { font-size: 1.4rem; margin: 4px 0 4px; }
h2 { font-size: 1.1rem; margin: 0 0 8px; }
.lead { color: var(--muted); margin: 0 0 12px; }
.search {
  width: 100%; padding: 12px 14px; margin: 4px 0 14px; font-size: 1rem;
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--card); color: var(--ink);
}
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  width: 100%; padding: 14px 16px; text-align: left;
  background: var(--card); color: var(--ink); text-decoration: none;
  border: 1px solid var(--line); border-radius: var(--radius); font-size: 1rem;
}
a.row:active { transform: scale(.99); }
.row .chev { color: var(--muted); font-size: 1.3rem; }
.row.disabled { opacity: .55; }
.pill {
  font-size: .72rem; padding: 2px 8px; border-radius: 999px;
  background: var(--line); color: var(--muted); white-space: nowrap;
}
.pill.ok { background: #dcebd2; color: #26501d; }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 560px) { .grid { grid-template-columns: repeat(3, 1fr); } }
.tile {
  display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;
  padding: 16px 8px; text-decoration: none; color: var(--ink);
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
}
.tile.seen, .row.seen { border: 3px solid #2f8f46; }
.tile.unseen, .row.unseen { border: 3px solid #c0392b; }
.seenline { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 0 0 10px; }
.seenline .sq { display: inline-block; width: 14px; height: 14px; border-radius: 4px; border: 3px solid; vertical-align: -2px; margin-right: 4px; }
.seenline .sq.g { border-color: #2f8f46; } .seenline .sq.r { border-color: #c0392b; }
.seenpad { height: 78px; }
.seenbtn {
  position: fixed; left: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 20;
  display: flex; align-items: center; gap: 10px; padding: 10px 18px 10px 12px;
  border-radius: 999px; border: 3px solid #c0392b; background: var(--card); color: var(--ink);
  font: 600 .95rem/1.2 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; box-shadow: 0 2px 12px rgba(0,0,0,.28); cursor: pointer;
}
.seenbtn .dot { width: 26px; height: 26px; border-radius: 50%; border: 3px solid #c0392b; background: transparent; flex: none; }
.seenbtn.on { border-color: #2f8f46; }
.seenbtn.on .dot { border-color: #2f8f46; background: #2f8f46; box-shadow: inset 0 0 0 3px var(--card); }
.camBtn {
  display: flex; align-items: center; justify-content: center; gap: 10px; margin: 0 0 6px; padding: 13px 16px;
  background: var(--brand); color: #fff; border-radius: var(--radius); font-weight: 700; cursor: pointer;
}
.camBtn.alt { background: var(--line); color: var(--ink); padding: 9px 16px; font-weight: 600; }
.camBtn svg { width: 24px; height: 24px; flex: none; }
.camBtn input { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
.camhint { margin: 0 0 14px; font-size: .8rem; }
.recbox { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; padding: 16px; }
[hidden] { display: none !important; }
.recbox[hidden] { display: none; }
.qcount { margin: -8px 0 10px; font-weight: 600; }
.dltoast { position: fixed; left: 12px; right: 12px; bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 30; padding: 10px 14px; border-radius: var(--radius); background: var(--card); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 2px 12px rgba(0,0,0,.25); text-align: center; font-size: .9rem; }
.tipbox { background: #eef6ee; border-radius: 10px; padding: 8px 12px; margin: 8px 0; font-size: .92rem; }
.tipbox h3 { margin: 0 0 4px; font-size: 1rem; }
.tipbox ul { margin: 0; padding-left: 20px; }
.cgutext { max-height: 34vh; overflow: auto; margin: 8px 0; padding-right: 4px; font-size: .9rem; }
.cgutext p { margin: 0 0 8px; }
.recin { background: var(--card); color: var(--ink); border-radius: var(--radius); padding: 16px; width: min(420px, 100%); max-height: 90vh; overflow: auto; text-align: center; }
.recbtns { flex-wrap: wrap; }
.pendlink { display: inline-block; margin: 0 0 10px; padding: 7px 14px; border-radius: 999px; background: #c0392b; color: #fff; font-weight: 700; text-decoration: none; }
.pitem { display: flex; gap: 12px; align-items: flex-start; padding: 10px; margin: 0 0 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); }
.pitem img { width: 96px; height: 96px; object-fit: cover; border-radius: 10px; flex: none; background: #000; }
.pitem .pb { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.pitem .rbtn { padding: 8px 12px; font-size: .9rem; }
.pickrow { display: block; width: 100%; text-align: left; padding: 10px 12px; margin: 0 0 6px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); font: 600 1rem system-ui, sans-serif; cursor: pointer; }
#pl { max-height: 45vh; overflow: auto; margin: 8px 0; }
.recin video { width: 100%; max-height: 60vh; border-radius: 10px; margin-bottom: 10px; background: #000; }
.recin img { width: 100%; max-height: 40vh; object-fit: contain; border-radius: 10px; margin-bottom: 10px; background: #000; }
.recin h2 { margin: 4px 0 6px; }
.recin p { margin: 0 0 10px; color: var(--muted); }
.recin .bar { height: 10px; border-radius: 6px; background: var(--line); overflow: hidden; margin: 8px 0 12px; }
.recin .bar span { display: block; height: 100%; width: 0; background: #2f8f46; transition: width .2s; }
.recbtns { display: flex; gap: 8px; justify-content: center; }
.rbtn { border: 0; border-radius: 10px; padding: 10px 18px; font: 700 1rem system-ui, sans-serif; background: var(--line); color: var(--ink); cursor: pointer; }
.rbtn.primary { background: var(--brand); color: #fff; }
.tile .emoji { font-size: 2.2rem; }
.tile .nm { font-weight: 600; font-size: .95rem; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 16px; margin: 0 0 12px;
}
.card.park { border-left: 5px solid var(--accent); }
.hero { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.hero .emoji { font-size: 3rem; }
.sci { font-style: italic; color: var(--muted); margin: 0; }
.badge {
  display: inline-block; padding: 3px 10px; border-radius: 999px;
  color: #fff; font-size: .8rem; font-weight: 700;
}
.badge.LC { background: var(--st-lc); }
.badge.NT { background: var(--st-nt); }
.badge.VU { background: var(--st-vu); }
.badge.EN { background: var(--st-en); }
.badge.CR { background: var(--st-cr); }
.badge.VAR, .badge.NE { background: #6b7280; }
.types .ty { border-top: 1px solid #e2e2dc; padding: 10px 0; }
.types .ty h3 { margin: 0 0 2px; font-size: 1.02rem; }
.types .ty dl { margin: 6px 0 0; }
.types .ty dt { font-weight: 700; font-size: .85rem; margin-top: 4px; }
.types .ty dd { margin: 0; }
.chip.VAR, .chip.NE { background: #6b7280; color: #fff; border-color: transparent; font-weight: 700; }
.big { font-size: 1.15rem; font-weight: 700; margin: 2px 0 6px; }
.meta { color: var(--muted); font-size: .88rem; margin: 4px 0; }
.note { font-size: .92rem; margin: 8px 0 0; }
.conf {
  display: inline-block; font-size: .75rem; padding: 2px 8px; border-radius: 8px; margin-right: 6px;
  border: 1px solid var(--line); color: var(--muted);
}
.conf.official { border-color: #3a8a4a; color: #3a8a4a; }
.conf.scientific { border-color: #2f6fb0; color: #2f6fb0; }
.conf.unofficial { border-color: var(--st-en); color: var(--st-en); }
.conf.none { border-color: var(--st-cr); color: var(--st-cr); }
dl.facts { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; }
dl.facts dt { color: var(--muted); font-size: .9rem; }
dl.facts dd { margin: 0; }
.sources { margin: 8px 0 0; padding-left: 18px; font-size: .85rem; color: var(--muted); }
.sources a { color: var(--accent); overflow-wrap: anywhere; }
details summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
.warn {
  background: #fff4dc; color: #5a3d00; border: 1px solid #f0d9a0;
  border-radius: var(--radius); padding: 10px 14px; font-size: .88rem; margin: 0 0 12px;
}
@media (prefers-color-scheme: dark) { .warn { background: #3a2f12; color: #f3dfa8; border-color: #5a4a1d; } }
.footer { max-width: 760px; margin: 0 auto; padding: 0 14px 28px; color: var(--muted); font-size: .82rem; text-align: center; }
.footer a { color: var(--accent); }
.empty { color: var(--muted); text-align: center; padding: 20px 0; }
.upd { border-left: 4px solid var(--accent); }
.upd time { color: var(--muted); font-size: .82rem; }

.brand { letter-spacing: .02em; font-size: 1.25rem; }
.brand::before { content: ''; display: inline-block; width: 34px; height: 34px; margin-right: 10px; vertical-align: -10px; border-radius: 9px; background: #2e4a2a url(icone-192.png) center / cover no-repeat; box-shadow: 0 0 0 1px rgba(255,255,255,.18); }


/* --- v1.1 : photos, jauge, cartes d'information identiques --- */
.photo { position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: #2e4a2a; }
.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.photo .ph { position: absolute; inset: 0; display: grid; place-items: center; font-size: 2.4rem; font-weight: 800; color: #e8a63c;
  background: radial-gradient(circle at 50% 62%, rgba(232,166,60,.28) 0 42%, transparent 43%), #2e4a2a; }
.hero-photo { margin-bottom: 4px; }
.obslink { display: block; margin: 10px 0; font-weight: 700; }
.obsmap { height: 60vh; min-height: 320px; border-radius: 12px; margin: 10px 0; background: #ddd; }
.obsbar { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
.obsbar select { flex: 1; min-height: 44px; font: inherit; border-radius: 10px; padding: 0 8px; }
.obspop strong { display: block; font-size: 1rem; }
.obspop a.gm { display: inline-block; margin-top: 8px; padding: 8px 12px; border-radius: 10px; background: var(--brand); color: #fff; text-decoration: none; font-weight: 700; }
.menuov { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.45); }
.menu { position: fixed; top: 0; bottom: 0; left: 0; width: min(82vw, 320px); z-index: 41; background: var(--bg); color: var(--ink); padding: calc(14px + env(safe-area-inset-top)) 14px 18px; overflow-y: auto; box-shadow: 4px 0 18px rgba(0,0,0,.35); }
.menu h2 { margin: 6px 0 10px; font-size: .85rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.menu .mrow { display: block; width: 100%; text-align: left; border: 0; background: transparent; font: inherit; color: inherit; padding: 11px 10px; border-radius: 10px; text-decoration: none; cursor: pointer; }
.menu a.mrow { background: rgba(128,128,128,.18); margin-bottom: 4px; }
.menu .mrow.cur { background: var(--brand); color: #fff; font-weight: 700; }

.lang-btn { display: inline-flex; align-items: center; gap: 6px; }
.flag { border-radius: 2px; box-shadow: 0 0 0 1px rgba(255,255,255,.35); flex: none; }
.herowrap { position: relative; }
.zoombtn { position: absolute; right: 8px; bottom: 8px; width: 38px; height: 38px; border-radius: 10px; border: 0; background: rgba(0,0,0,.55); color: #fff; font-size: 20px; line-height: 1; cursor: pointer; }
.zoomview { position: fixed; inset: 0; z-index: 80; background: #000; overflow: hidden; touch-action: none; }
.zoomview img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transform-origin: 50% 50%; user-select: none; -webkit-user-drag: none; }
.zoomview button { position: absolute; top: 12px; right: 12px; z-index: 2; width: 44px; height: 44px; border-radius: 12px; border: 0; background: rgba(255,255,255,.22); color: #fff; font-size: 24px; }
.credit { margin: 0 0 8px; font-size: .75rem; color: var(--muted); text-align: right; }
.tile .photo { margin-bottom: 8px; }
.tile .gauge { margin-top: 6px; }
.gauge { display: inline-flex; gap: 3px; vertical-align: middle; }
.gauge i { display: block; width: 26px; height: 10px; border-radius: 3px; }
.gauge i.off { background: var(--line); }
.gauge.sm i { width: 14px; height: 6px; }
.gauge.lg { display: flex; gap: 4px; }
.gauge.lg i { flex: 1; width: auto; height: 16px; border-radius: 4px; }
.scale { display: flex; justify-content: space-between; font-size: .76rem; color: var(--muted); margin: 4px 0 8px; }
.chips { margin: 0 0 6px; }
.chip { display: inline-block; font-size: .8rem; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); margin: 0 6px 6px 0; }
.chip.official { border-color: #3a8a4a; color: #3a8a4a; }
.chip.scientific { border-color: #2f6fb0; color: #2f6fb0; }
.chip.unofficial { border-color: #d2631f; color: #d2631f; }
.chip.none { border-color: #b3261e; color: #b3261e; }
.chip.cty { color: var(--ink); }
.chip.cty.app { border-color: #3a8a4a; color: #3a8a4a; font-weight: 700; text-decoration: none; }
.chip.cty.back { border-color: #2f6fb0; color: #2f6fb0; }
.chip.cty.gone { border-style: dashed; opacity: .8; }
.rh { font-size: .92rem; margin: 12px 0 4px; }
.chip.LC, .chip.NT, .chip.VU, .chip.EN, .chip.CR { color: #fff; border-color: transparent; font-weight: 700; }
.chip.LC { background: #3a8a4a; } .chip.NT { background: #8aa62a; } .chip.VU { background: #d49a1a; }
.chip.EN { background: #d2631f; } .chip.CR { background: #b3261e; }
.badge.NT { background: #8aa62a; }
.info { border-left: 5px solid var(--accent); }
.info.world { border-left-color: var(--brand); }
.info .fig { font-size: 1.15rem; font-weight: 700; margin: 2px 0 8px; }
.info .meta { margin: 4px 0 6px; }
.legend { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 12px; }
.legend li { display: flex; gap: 12px; align-items: center; }
.legend .gauge { flex: none; }
.legend strong { display: block; }
.legend .t { display: block; font-size: .86rem; color: var(--muted); }
.lvl { margin: 0 0 8px; }

/* --- v1.3 : comment le reconnaître --- */
.recog { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.recog h3 { font-size: 1rem; margin: 0 0 6px; }
.recog p { margin: 0 0 10px; }
.sexes { display: grid; gap: 8px; grid-template-columns: 1fr; }
@media (min-width: 560px) { .sexes { grid-template-columns: 1fr 1fr; } .sexes .sx.both { grid-column: 1 / -1; } }
.sx { border: 1px solid var(--line); border-left-width: 5px; border-radius: 10px; padding: 8px 12px; background: var(--bg); }
.sx strong { display: block; font-size: .85rem; }
.sx span { font-size: .92rem; }
.sx.m { border-left-color: #2f6fb0; }
.sx.f { border-left-color: #c2527a; }
.sx.both { border-left-color: var(--muted); }
</style>
</head>

  function obsQSave(a) { try { localStorage.setItem(OBSQ_KEY, JSON.stringify(a)); } catch (e) {} }

        var it = obsQ().filter(function (x) { return x.data.id === id; })[0];
        if (!it) return;
        return fetch(OBS_URL + "/", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(it.data) }).then(function (r) {
          if (r.ok) obsQSave(obsQ().filter(function (x) { return x.data.id !== id; }));
          else if (r.status >= 400 && r.status < 500) obsQSave(obsQ().map(function (x) { if (x.data.id === id) x.bad = true; return x; }));
        }).catch(function () {});
      });
    }, Promise.resolve()).then(function () { obsFlushing = false; }, function () { obsFlushing = false; });
  }
  function obsInQueue(id) { return obsQ().some(function (x) { return x.data.id === id; }); }
  function obsStart(aid, shot) {
    recShow({ img: shot, title: T().obsQTitle, text: tr(D.animals[aid].name) + " — " + T().obsQText, buttons: [
      { label: T().obsYesNow, primary: true, fn: function () { obsLocate(aid, shot); } },
      { label: T().obsOlder, fn: function () { obsForm(aid, shot, { coord: "", date: obsToday() }); } },
      { label: T().obsNoThanks, fn: recHide }] });
  }
  function obsToday() { var d = new Date(); return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
  function obsLocate(aid, shot) {
    recShow({ img: shot, title: T().obsLocating, buttons: [{ label: T().camClose, fn: recHide }] });
    var done = false;
    function fail() {
      if (done) return; done = true;
      recShow({ img: shot, title: T().obsLocErr, buttons: [
        { label: T().obsManual, primary: true, fn: function () { obsForm(aid, shot, { coord: "", date: obsToday() }); } },
        { label: T().retry, fn: function () { obsLocate(aid, shot); } },
        { label: T().camClose, fn: recHide }] });
    }
    if (!navigator.geolocation) { fail(); return; }
    navigator.geolocation.getCurrentPosition(function (pos) {
      if (done) return; done = true;
      obsConfirm(aid, shot, pos.coords.latitude, pos.coords.longitude, Date.now());
    }, fail, { enableHighAccuracy: true, timeout: 20000, maximumAge: 30000 });
  }
  function obsParseCoord(str) {
    var m = String(str || "").replace(/[−–]/g, "-").match(/-?\d+(?:[.,]\d+)?/g);
    if (!m || m.length < 2) return null;
    var lat = parseFloat(m[0].replace(",", ".")), lng = parseFloat(m[1].replace(",", "."));
    if (!(lat >= -90 && lat <= 90) || !(lng >= -180 && lng <= 180)) return null;
    return { lat: lat, lng: lng };
  }
  function obsForm(aid, shot, st, err) {
    var html = '<div style="text-align:left"><label class="meta" for="obsCoord">' + esc(T().obsCoordLbl) + '</label>' +
      '<input class="search" id="obsCoord" type="text" inputmode="text" autocomplete="off" placeholder="-24.10, 31.50" value="' + esc(st.coord) + '">' +
      '<label class="meta" for="obsDate">' + esc(T().obsDateLbl) + '</label>' +
      '<input class="search" id="obsDate" type="date" max="' + obsToday() + '" value="' + esc(st.date) + '">' +
      (err ? '<p class="meta" style="color:#b42318">' + esc(err) + "</p>" : "") + "</div>";
    recShow({ img: shot, title: T().obsFormTitle, html: html, buttons: [
      { label: T().obsContinue, primary: true, fn: function () {
          var c = obsParseCoord(st.coord);
          if (!c) { obsForm(aid, shot, st, T().obsCoordBad); return; }
          var dm = /^(\d{4})-(\d{2})-(\d{2})$/.exec(st.date || "");
          if (!dm) { obsForm(aid, shot, st, T().obsDateBad); return; }
          var ts = st.date === obsToday() ? Date.now() : new Date(+dm[1], +dm[2] - 1, +dm[3], 12, 0, 0).getTime();
          if (!(ts > 1577836800000) || ts > Date.now() + 3600000) { obsForm(aid, shot, st, T().obsDateBad); return; }
          obsConfirm(aid, shot, c.lat, c.lng, ts);
        } },
      { label: T().obsPickMap, fn: function () {
          obsPick(aid, shot, st, function (lat, lng) { st.coord = lat.toFixed(5) + ", " + lng.toFixed(5); obsForm(aid, shot, st); });
        } },
      { label: T().camClose, fn: recHide }],
      after: function (el) {
        var ci = el.querySelector("#obsCoord"), di = el.querySelector("#obsDate");
        ci.addEventListener("input", function () { st.coord = ci.value; });
        di.addEventListener("input", function () { st.date = di.value; });
      } });
  }
  function obsPick(aid, shot, st, done) {
    var pt = null;
    recShow({ title: T().obsPickTitle, text: T().obsPickText, html: '<div class="obsmap" id="pickMap" style="height:42vh;min-height:240px"></div><p class="meta" id="pickMsg">' + esc(T().obsLoading) + "</p>", buttons: [
      { label: T().obsPickOk, primary: true, fn: function () { if (pt) done(pt.lat, pt.lng); } },
      { label: T().camClose, fn: function () { obsForm(aid, shot, st); } }],
      after: function (el) {
        var msg = el.querySelector("#pickMsg");
        loadLeaflet().then(function () {
          var L = window.L, c = D.parks.length === 1 && D.parks[0].map ? D.parks[0].map : { lat: 2, lng: 20, zoom: 3 };
          var map = L.map(el.querySelector("#pickMap")).setView([c.lat, c.lng], c.zoom), mk = null;
          L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap contributors" }).addTo(map);
          map.on("click", function (e) {
            pt = { lat: e.latlng.lat, lng: e.latlng.lng };
            if (mk) mk.setLatLng(e.latlng); else mk = L.circleMarker(e.latlng, { radius: 9, color: "#fff", weight: 2, fillColor: "#c2410c", fillOpacity: 0.95 }).addTo(map);
            msg.textContent = pt.lat.toFixed(5) + ", " + pt.lng.toFixed(5);
          });
          setTimeout(function () { map.invalidateSize(); }, 200);
          msg.textContent = "";
        }).catch(function () { msg.textContent = T().obsNeedNet; });
      } });
  }
  function obsConfirm(aid, shot, lat, lng, ts) {
    var pk = parkOf(lat, lng), lbl = pk ? T().obsInPark + tr(findPark(pk).name) : T().obsNoPark;
    var txt = lat.toFixed(5) + ", " + lng.toFixed(5) + " · " + obsDate(ts) + " — " + lbl + " " + T().obsConfirmText;
    recShow({ img: shot, title: T().obsConfirmTitle + " " + tr(D.animals[aid].name), text: txt, buttons: [
      { label: T().obsSave, primary: true, fn: function () { obsSubmit(aid, shot, lat, lng, ts, pk); } },
      { label: T().obsNoThanks, fn: recHide }] });
  }
  function obsSubmit(aid, shot, lat, lng, ts, pk) {
    var rec = { id: obsNewId(), animal: aid, lat: Math.round(lat * 1e5) / 1e5, lng: Math.round(lng * 1e5) / 1e5, ts: Math.round(ts), park: pk };
    var q = obsQ(); q.push({ data: rec }); obsQSave(q);
    askPersist();
    obsFlush().then(function () {
      var queued = obsInQueue(rec.id), hash = "#/obs/" + (pk || "none");
      recShow({ img: shot, title: queued ? T().obsQueued : T().obsSent, text: queued ? T().obsQueuedText : T().obsSentText, buttons: [
        { label: T().obsSeeMap, primary: !queued, fn: function () { recHide(); location.hash = hash; } },
        { label: T().camClose, fn: recHide }] });
    });
  }
  window.addEventListener("online", function () { if (cguAccepted()) obsFlush(); });
  function viewObs(pid) {
    if (!pid) {
      var li = D.parks.map(function (p) {
        return '<li><a class="row" href="#/obs/' + p.id + '"><span>' + esc(tr(p.name)) + '</span><span class="chev">›</span></a></li>';
      }).join("") + '<li><a class="row" href="#/obs/none"><span>' + esc(T().obsNone) + '</span><span class="chev">›</span></a></li>';
      var nq = obsQ().length;
      return { html: "<h1>" + esc(T().obsTitle) + '</h1><p class="lead">' + esc(T().obsLead) + "</p>" + (nq ? '<p class="meta"><strong>' + nq + "</strong> " + esc(T().obsPending) + "</p>" : "") + '<ul class="list">' + li + "</ul>" };
    }
    var park = pid === "none" ? null : findPark(pid);
    if (pid !== "none" && !park) return viewObs(null);
    var title = park ? tr(park.name) : T().obsNone;
    var html = "<h1>" + esc(title) + '</h1><div class="obsbar"><select id="obsSel" aria-label="' + esc(T().obsAll) + '"><option value="">' + esc(T().obsAll) + '</option></select></div>' +
      '<p class="meta" id="obsMsg">' + esc(T().obsLoading) + '</p><div class="obsmap" id="obsMap"></div><p class="meta">' + esc(T().obsMapNote) + "</p>";
    return {
      html: html,
      after: function () {
        var msg = document.getElementById("obsMsg"), sel = document.getElementById("obsSel"), el = document.getElementById("obsMap");
        var mapRef = null, layer = null, all = [], alive = true;
        window.addEventListener("hashchange", function once() { alive = false; window.removeEventListener("hashchange", once); if (mapRef) { try { mapRef.remove(); } catch (e) {} } });
        function draw() {
          if (!mapRef || !window.L) return;
          if (layer) layer.clearLayers(); else layer = window.L.layerGroup().addTo(mapRef);
          var f = sel.value, shown = all.filter(function (o) { return !f || o.animal === f; });
          shown.forEach(function (o) {
            var a = D.animals[o.animal], nm = a ? tr(a.name) : o.animal;
            var box = document.createElement("div"); box.className = "obspop";
            box.innerHTML = "<strong>" + esc(nm) + "</strong>" + esc(T().obsOn) + " " + esc(obsDate(o.ts)) + "<br>" + esc(o.lat.toFixed(5) + ", " + o.lng.toFixed(5)) + "<br>" +
              '<a class="gm" target="_blank" rel="noopener" href="https://www.google.com/maps?q=' + o.lat + "," + o.lng + '">' + esc(T().obsOpenG) + "</a>";
            window.L.circleMarker([o.lat, o.lng], { radius: 8, color: "#fff", weight: 2, fillColor: "#c2410c", fillOpacity: 0.95 }).bindPopup(box).addTo(layer);
          });
          msg.textContent = shown.length ? "" : T().obsEmpty;
        }
        sel.addEventListener("change", draw);
        Promise.all([loadLeaflet(), fetch(OBS_URL + "/?park=" + encodeURIComponent(pid) + "&limit=1000").then(function (r) { if (!r.ok) throw new Error("http"); return r.json(); })]).then(function (rs) {
          if (!alive) return;
          all = (rs[1].observations || []).map(function (o) { return { id: o.id, animal: o.animal, lat: Number(o.lat), lng: Number(o.lng), ts: Number(o.ts) }; });
          var names = {}; all.forEach(function (o) { names[o.animal] = 1; });
          Object.keys(names).sort(function (x, y) { return tr((D.animals[x] || { name: { en: x, fr: x } }).name).localeCompare(tr((D.animals[y] || { name: { en: y, fr: y } }).name), lang); }).forEach(function (k) {
            var o = document.createElement("option"); o.value = k; o.textContent = D.animals[k] ? tr(D.animals[k].name) : k; sel.appendChild(o);
          });
          var L = window.L, c = park && park.map ? park.map : { lat: 2, lng: 20, zoom: 3 };
          mapRef = L.map(el).setView([c.lat, c.lng], c.zoom);
          L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap contributors" }).addTo(mapRef);
          setTimeout(function () { if (mapRef) mapRef.invalidateSize(); }, 200);
          draw();
        }).catch(function (e) {
          if (!alive) return;
          msg.textContent = (e && e.message === "leaflet") || !navigator.onLine ? T().obsNeedNet : T().obsErr;
          el.hidden = true;
        });
      }
    };
  }
  function viewNews() {
    var html = "<h1>" + esc(T().whatsNew) + '</h1><p class="lead">' + esc(T().updatesLead) + "</p>" +
      D.updates.map(function (u) {
        return '<article class="card upd"><time datetime="' + esc(u.date) + '">' + esc(fmtDate(u.date)) + "</time>" +
          "<h2>" + esc(tr(u.title)) + "</h2><p>" + esc(tr(u.text)) + "</p>" + sourceList(u.src) + "</article>";
      }).join("");
    return { html: html };
  }

  /* ---------- router ---------- */
  function parse() {
    var h = (location.hash || "#/").replace(/^#\/?/, "");
    var parts = h.split("/").filter(Boolean);
    return parts;
  }

  function parentHash(parts) {
    if (parts[0] === "obs") return parts[1] ? "#/obs" : "#/";
    if (parts[0] === "a") return "#/";
    if (parts[0] === "p" && parts[2] === "a") return "#/p/" + parts[1];
    if (parts[0] === "p") {
      var p = findPark(parts[1]);
      return p ? "#/c/" + p.country : "#/";
    }
    return "#/";
  }

  /* ---------- menu à gauche : « vous êtes ici », du haut vers le bas ---------- */
  var menuEl = document.getElementById("menu"), menuOv = document.getElementById("menuOv"), menuBtn = document.getElementById("menuBtn");
  function menuChain() {
    var p = parse(), ch = [{ label: T().menuHome, href: "#/" }], pk, c;
    if (p[0] === "c" && p[1] && findCountry(p[1])) ch.push({ label: countryName(findCountry(p[1])), href: "#/c/" + p[1] });
    else if (p[0] === "p" && p[1] && findPark(p[1])) {
      pk = findPark(p[1]); c = findCountry(pk.country);
      if (c) ch.push({ label: countryName(c), href: "#/c/" + c.id });
      ch.push({ label: tr(pk.name), href: "#/p/" + pk.id });
      if (p[2] === "a" && D.animals[p[3]]) ch.push({ label: tr(D.animals[p[3]].name), href: "#/p/" + pk.id + "/a/" + p[3] });
    } else if (p[0] === "a" && D.animals[p[1]]) ch.push({ label: tr(D.animals[p[1]].name), href: "#/a/" + p[1] });
    else if (p[0] === "obs") {
      ch.push({ label: T().obsTitle, href: "#/obs" });
      if (p[1]) ch.push({ label: p[1] === "none" ? T().obsNone : (findPark(p[1]) ? tr(findPark(p[1]).name) : p[1]), href: "#/obs/" + p[1] });
    } else if (p[0] === "news") ch.push({ label: T().whatsNew, href: "#/news" });
    else if (p[0] === "verify") ch.push({ label: T().pendTitle, href: "#/verify" });
    return ch;
  }
  function menuClose() { menuEl.hidden = true; menuOv.hidden = true; menuBtn.setAttribute("aria-expanded", "false"); }
  function menuOpen() {
    var ch = menuChain(), h = "<h2>" + esc(T().menuTitle) + "</h2>";
    ch.forEach(function (x, i) {
      var last = i === ch.length - 1, pad = 'style="margin-left:' + (i * 14) + 'px;width:calc(100% - ' + (i * 14) + 'px)"';
      h += last ? '<div class="mrow cur" aria-current="page" ' + pad + ">" + esc(x.label) + "</div>" : '<a class="mrow" href="' + x.href + '" ' + pad + ">" + esc(x.label) + "</a>";
    });
    menuEl.innerHTML = h;
    menuEl.hidden = false; menuOv.hidden = false; menuBtn.setAttribute("aria-expanded", "true");
    menuEl.querySelectorAll("a.mrow").forEach(function (a) { a.addEventListener("click", menuClose); });
  }
  menuBtn.setAttribute("aria-label", "Menu");
  menuBtn.addEventListener("click", function () { if (menuEl.hidden) menuOpen(); else menuClose(); });
  menuOv.addEventListener("click", menuClose);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") menuClose(); });
  window.addEventListener("hashchange", menuClose);

  function render() {
    var parts = parse();
    var view;
    if (parts[0] === "c" && parts[1]) view = viewCountry(parts[1]);
    else if (parts[0] === "a" && parts[1]) view = viewAnimal(null, parts[1]);
    else if (parts[0] === "p" && parts[1] && parts[2] === "a" && parts[3]) view = viewAnimal(parts[1], parts[3]);
    else if (parts[0] === "p" && parts[1]) view = viewPark(parts[1]);
    else if (parts[0] === "obs") view = viewObs(parts[1]);
    else if (parts[0] === "news") view = viewNews();
    else if (parts[0] === "verify") view = viewVerify();
    else view = viewCountries();

    app.innerHTML = view.html;
    if (view.after) view.after();

    var atHome = parts.length === 0;
    backBtn.hidden = atHome;
    backBtn.onclick = function () { location.hash = parentHash(parts); };
    backBtn.setAttribute("aria-label", T().back);
    menuBtn.setAttribute("aria-label", T().menuTitle);

    document.documentElement.lang = lang;
    document.title = T().title;
    brand.textContent = T().title;
    langBtn.innerHTML = langLabel();
    langBtn.setAttribute("aria-label", lang === "en" ? "Passer en français" : "Switch to English");

    footer.innerHTML =
      '<p><a href="#/news">' + esc(T().whatsNew) + "</a></p>" +
      "<p>" + esc(T().checked) + ": " + esc(fmtDate(D.meta.lastChecked)) + " · " + esc(T().next) + ": " + esc(fmtDate(D.meta.nextUpdate)) + "</p>" +
      '<p class="meta"><a href="#" id="cguLink">' + esc(T().cguLink) + "</a></p>";
    var cl = document.getElementById("cguLink");
    if (cl) cl.onclick = function (ev) { ev.preventDefault(); showCgu(true); };

    window.scrollTo(0, 0);
  }

  langBtn.addEventListener("click", function () {
    lang = lang === "en" ? "fr" : "en";
    try { localStorage.setItem("awf-lang", lang); } catch (e) {}
    render();
  });
  window.addEventListener("hashchange", render);

  render();
  cleanOld();
  if (!cguAccepted()) showCgu(false); else { askPersist(); obsFlush(); }
})();

</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
