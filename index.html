<!doctype html>
<html lang="fr">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saffrica</title>
<meta name="theme-color" content="#2e4a2a">
<link rel="icon" href="icone.png" type="image/png">
<link rel="apple-touch-icon" href="icone.png">

<style>
:root {
  --bg: #f5efe0;
  --card: #fffdf8;
  --ink: #26301f;
  --muted: #6a7060;
  --line: #e3dccb;
  --brand: #2e4a2a;
  --accent: #d9650f;
  --radius: 14px;
  --st-lc: #3a8a4a;
  --st-nt: #7a9a2a;
  --st-vu: #d49a1a;
  --st-en: #d2631f;
  --st-cr: #b3261e;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161a13;
    --card: #1f251b;
    --ink: #ece8da;
    --muted: #a3a794;
    --line: #333b2c;
    --brand: #1f3a1f;
    --accent: #f5882a;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding-bottom: env(safe-area-inset-bottom);
}
.topbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 8px;
  padding: calc(8px + env(safe-area-inset-top)) 12px 8px;
  background: var(--brand); color: #fff;
}
.brand { flex: 1; color: #fff; text-decoration: none; font-weight: 700; font-size: 1.05rem; }
.icon-btn, .lang-btn {
  border: 0; border-radius: 10px; color: #fff; background: rgba(255,255,255,.16);
  min-width: 44px; height: 44px; font-size: 1.1rem; font-weight: 700; cursor: pointer;
}
.icon-btn { font-size: 1.8rem; line-height: 1; }
main { max-width: 760px; margin: 0 auto; padding: 16px 14px 24px; outline: none; }
h1 { font-size: 1.4rem; margin: 4px 0 4px; }
h2 { font-size: 1.1rem; margin: 0 0 8px; }
.lead { color: var(--muted); margin: 0 0 12px; }
.search {
  width: 100%; padding: 12px 14px; margin: 4px 0 14px; font-size: 1rem;
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--card); color: var(--ink);
}
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  width: 100%; padding: 14px 16px; text-align: left;
  background: var(--card); color: var(--ink); text-decoration: none;
  border: 1px solid var(--line); border-radius: var(--radius); font-size: 1rem;
}
a.row:active { transform: scale(.99); }
.row .chev { color: var(--muted); font-size: 1.3rem; }
.row.disabled { opacity: .55; }
.pill {
  font-size: .72rem; padding: 2px 8px; border-radius: 999px;
  background: var(--line); color: var(--muted); white-space: nowrap;
}
.pill.ok { background: #dcebd2; color: #26501d; }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 560px) { .grid { grid-template-columns: repeat(3, 1fr); } }
.tile {
  display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;
  padding: 16px 8px; text-decoration: none; color: var(--ink);
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
}
.tile.seen, .row.seen { border: 3px solid #2f8f46; }
.tile.unseen, .row.unseen { border: 3px solid #c0392b; }
.seenline { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 0 0 10px; }
.seenline .sq { display: inline-block; width: 14px; height: 14px; border-radius: 4px; border: 3px solid; vertical-align: -2px; margin-right: 4px; }
.seenline .sq.g { border-color: #2f8f46; } .seenline .sq.r { border-color: #c0392b; }
.seenpad { height: 78px; }
.seenbtn {
  position: fixed; left: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 20;
  display: flex; align-items: center; gap: 10px; padding: 10px 18px 10px 12px;
  border-radius: 999px; border: 3px solid #c0392b; background: var(--card); color: var(--ink);
  font: 600 .95rem/1.2 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; box-shadow: 0 2px 12px rgba(0,0,0,.28); cursor: pointer;
}
.seenbtn .dot { width: 26px; height: 26px; border-radius: 50%; border: 3px solid #c0392b; background: transparent; flex: none; }
.seenbtn.on { border-color: #2f8f46; }
.seenbtn.on .dot { border-color: #2f8f46; background: #2f8f46; box-shadow: inset 0 0 0 3px var(--card); }
.camBtn {
  display: flex; align-items: center; justify-content: center; gap: 10px; margin: 0 0 6px; padding: 13px 16px;
  background: var(--brand); color: #fff; border-radius: var(--radius); font-weight: 700; cursor: pointer;
}
.camBtn.alt { background: var(--line); color: var(--ink); padding: 9px 16px; font-weight: 600; }
.camBtn svg { width: 24px; height: 24px; flex: none; }
.camBtn input { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
.camhint { margin: 0 0 14px; font-size: .8rem; }
.recbox { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; padding: 16px; }
.recbox[hidden] { display: none; }
.recin { background: var(--card); color: var(--ink); border-radius: var(--radius); padding: 16px; width: min(420px, 100%); max-height: 90vh; overflow: auto; text-align: center; }
.recin img { width: 100%; max-height: 40vh; object-fit: contain; border-radius: 10px; margin-bottom: 10px; background: #000; }
.recin h2 { margin: 4px 0 6px; }
.recin p { margin: 0 0 10px; color: var(--muted); }
.recin .bar { height: 10px; border-radius: 6px; background: var(--line); overflow: hidden; margin: 8px 0 12px; }
.recin .bar span { display: block; height: 100%; width: 0; background: #2f8f46; transition: width .2s; }
.recbtns { display: flex; gap: 8px; justify-content: center; }
.rbtn { border: 0; border-radius: 10px; padding: 10px 18px; font: 700 1rem system-ui, sans-serif; background: var(--line); color: var(--ink); cursor: pointer; }
.rbtn.primary { background: var(--brand); color: #fff; }
.tile .emoji { font-size: 2.2rem; }
.tile .nm { font-weight: 600; font-size: .95rem; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 16px; margin: 0 0 12px;
}
.card.park { border-left: 5px solid var(--accent); }
.hero { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.hero .emoji { font-size: 3rem; }
.sci { font-style: italic; color: var(--muted); margin: 0; }
.badge {
  display: inline-block; padding: 3px 10px; border-radius: 999px;
  color: #fff; font-size: .8rem; font-weight: 700;
}
.badge.LC { background: var(--st-lc); }
.badge.NT { background: var(--st-nt); }
.badge.VU { background: var(--st-vu); }
.badge.EN { background: var(--st-en); }
.badge.CR { background: var(--st-cr); }
.big { font-size: 1.15rem; font-weight: 700; margin: 2px 0 6px; }
.meta { color: var(--muted); font-size: .88rem; margin: 4px 0; }
.note { font-size: .92rem; margin: 8px 0 0; }
.conf {
  display: inline-block; font-size: .75rem; padding: 2px 8px; border-radius: 8px; margin-right: 6px;
  border: 1px solid var(--line); color: var(--muted);
}
.conf.official { border-color: #3a8a4a; color: #3a8a4a; }
.conf.scientific { border-color: #2f6fb0; color: #2f6fb0; }
.conf.unofficial { border-color: var(--st-en); color: var(--st-en); }
.conf.none { border-color: var(--st-cr); color: var(--st-cr); }
dl.facts { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; }
dl.facts dt { color: var(--muted); font-size: .9rem; }
dl.facts dd { margin: 0; }
.sources { margin: 8px 0 0; padding-left: 18px; font-size: .85rem; color: var(--muted); }
.sources a { color: var(--accent); overflow-wrap: anywhere; }
details summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
.warn {
  background: #fff4dc; color: #5a3d00; border: 1px solid #f0d9a0;
  border-radius: var(--radius); padding: 10px 14px; font-size: .88rem; margin: 0 0 12px;
}
@media (prefers-color-scheme: dark) { .warn { background: #3a2f12; color: #f3dfa8; border-color: #5a4a1d; } }
.footer { max-width: 760px; margin: 0 auto; padding: 0 14px 28px; color: var(--muted); font-size: .82rem; text-align: center; }
.footer a { color: var(--accent); }
.empty { color: var(--muted); text-align: center; padding: 20px 0; }
.upd { border-left: 4px solid var(--accent); }
.upd time { color: var(--muted); font-size: .82rem; }

.brand { letter-spacing: .02em; font-size: 1.25rem; }
.brand::before { content: ''; display: inline-block; width: 34px; height: 34px; margin-right: 10px; vertical-align: -10px; border-radius: 9px; background: #2e4a2a url(icone-192.png) center / cover no-repeat; box-shadow: 0 0 0 1px rgba(255,255,255,.18); }


/* --- v1.1 : photos, jauge, cartes d'information identiques --- */
.photo { position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: #2e4a2a; }
.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.photo .ph { position: absolute; inset: 0; display: grid; place-items: center; font-size: 2.4rem; font-weight: 800; color: #e8a63c;
  background: radial-gradient(circle at 50% 62%, rgba(232,166,60,.28) 0 42%, transparent 43%), #2e4a2a; }
.hero-photo { margin-bottom: 4px; }
.credit { margin: 0 0 8px; font-size: .75rem; color: var(--muted); text-align: right; }
.tile .photo { margin-bottom: 8px; }
.tile .gauge { margin-top: 6px; }
.gauge { display: inline-flex; gap: 3px; vertical-align: middle; }
.gauge i { display: block; width: 26px; height: 10px; border-radius: 3px; }
.gauge i.off { background: var(--line); }
.gauge.sm i { width: 14px; height: 6px; }
.gauge.lg { display: flex; gap: 4px; }
.gauge.lg i { flex: 1; width: auto; height: 16px; border-radius: 4px; }
.scale { display: flex; justify-content: space-between; font-size: .76rem; color: var(--muted); margin: 4px 0 8px; }
.chips { margin: 0 0 6px; }
.chip { display: inline-block; font-size: .8rem; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); margin: 0 6px 6px 0; }
.chip.official { border-color: #3a8a4a; color: #3a8a4a; }
.chip.scientific { border-color: #2f6fb0; color: #2f6fb0; }
.chip.unofficial { border-color: #d2631f; color: #d2631f; }
.chip.none { border-color: #b3261e; color: #b3261e; }
.chip.cty { color: var(--ink); }
.chip.cty.app { border-color: #3a8a4a; color: #3a8a4a; font-weight: 700; text-decoration: none; }
.chip.cty.back { border-color: #2f6fb0; color: #2f6fb0; }
.chip.cty.gone { border-style: dashed; opacity: .8; }
.rh { font-size: .92rem; margin: 12px 0 4px; }
.chip.LC, .chip.NT, .chip.VU, .chip.EN, .chip.CR { color: #fff; border-color: transparent; font-weight: 700; }
.chip.LC { background: #3a8a4a; } .chip.NT { background: #8aa62a; } .chip.VU { background: #d49a1a; }
.chip.EN { background: #d2631f; } .chip.CR { background: #b3261e; }
.badge.NT { background: #8aa62a; }
.info { border-left: 5px solid var(--accent); }
.info.world { border-left-color: var(--brand); }
.info .fig { font-size: 1.15rem; font-weight: 700; margin: 2px 0 8px; }
.info .meta { margin: 4px 0 6px; }
.legend { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 12px; }
.legend li { display: flex; gap: 12px; align-items: center; }
.legend .gauge { flex: none; }
.legend strong { display: block; }
.legend .t { display: block; font-size: .86rem; color: var(--muted); }
.lvl { margin: 0 0 8px; }

/* --- v1.3 : comment le reconnaître --- */
.recog { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.recog h3 { font-size: 1rem; margin: 0 0 6px; }
.recog p { margin: 0 0 10px; }
.sexes { display: grid; gap: 8px; grid-template-columns: 1fr; }
@media (min-width: 560px) { .sexes { grid-template-columns: 1fr 1fr; } .sexes .sx.both { grid-column: 1 / -1; } }
.sx { border: 1px solid var(--line); border-left-width: 5px; border-radius: 10px; padding: 8px 12px; background: var(--bg); }
.sx strong { display: block; font-size: .85rem; }
.sx span { font-size: .92rem; }
.sx.m { border-left-color: #2f6fb0; }
.sx.f { border-left-color: #c2527a; }
.sx.both { border-left-color: var(--muted); }
</style>
</head>

  /* ---------- animaux déjà vus (mémorisé sur cet appareil) ---------- */

  /* ---------- reconnaissance par photo ----------
     Le modèle (CLIP) tourne dans le navigateur. Il est téléchargé la première fois
     seulement, puis gardé par le navigateur. Aucune photo n'est envoyée sur internet. */
  var REC = {
    lib: "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2",
    model: "Xenova/clip-vit-base-patch32",
    threshold: 0.25, /* en dessous de ce score : « animal non reconnu » */

  };
  window.SAFFRICA_REC = REC;
  var NOT_IN_APP = ["a domestic dog", "a domestic cat", "a cow", "a horse", "a sheep", "a goat", "a pig", "a person", "a small songbird",
    "a snake", "a lizard", "a crocodile", "a fish", "an insect", "a car", "a building", "a plant", "a landscape with no animal", "food", "a drawing or a toy"];
  function recCandidatesUnused() {
    if (REC.cands) return REC.cands;
    var labels = [], map = {};
    Object.keys(D.animals).forEach(function (id) {
      var A = D.animals[id];
      var n = A.name.en.replace(/\s*\([^)]*\)\s*/g, " ").replace(/\s+/g, " ").trim();
      var l1 = (/^[aeiou]/i.test(n) ? "an " : "a ") + n + ", a wild animal in Africa";
      labels.push(l1); map[l1] = id;
      if (A.sci) { var l2 = A.sci.replace(/\s*\([^)]*\)/g, "").trim(); labels.push(l2); map[l2] = id; }
    });
    NOT_IN_APP.forEach(function (l) { labels.push(l); });
    REC.cands = { labels: labels, map: map };
    return REC.cands;
  }
  function recEl() {
    var el = document.getElementById("rec");
    if (el) return el;
    el = document.createElement("div");
    el.id = "rec"; el.className = "recbox"; el.hidden = true;
    document.body.appendChild(el);
    return el;
  }
  function recShow(o) {
    var el = recEl();
    el.hidden = false;
    el.innerHTML = '<div class="recin">' + (o.img ? '<img src="' + esc(o.img) + '" alt="">' : "") +
      (o.title ? "<h2>" + esc(o.title) + "</h2>" : "") + (o.text ? "<p>" + esc(o.text) + "</p>" : "") +
      (o.bar != null ? '<div class="bar"><span style="width:' + o.bar + '%"></span></div><p class="meta" id="recmb"></p>' : "") +
      '<div class="recbtns"></div></div>';
    var box = el.querySelector(".recbtns");
    (o.buttons || []).forEach(function (x) {
      var bt = document.createElement("button");
      bt.type = "button"; bt.className = "rbtn" + (x.primary ? " primary" : ""); bt.textContent = x.label; bt.onclick = x.fn;
      box.appendChild(bt);
    });
  }
  function recHide() { var el = document.getElementById("rec"); if (el) el.hidden = true; }
  function recProgress(p) {
    if (!p || p.status !== "progress" || !p.file) return;
    recProgress.files = recProgress.files || {};
    recProgress.files[p.file] = { l: p.loaded || 0, t: p.total || 0 };
    var l = 0, t = 0;
    for (var k in recProgress.files) { l += recProgress.files[k].l; t += recProgress.files[k].t; }
    var span = document.querySelector("#rec .bar span"), mb = document.getElementById("recmb");
    if (span && t) span.style.width = Math.round(100 * l / t) + "%";
    if (mb && t) mb.textContent = Math.round(l / 1048576) + " / " + Math.round(t / 1048576) + " Mo";
  }
  /* Moteur : encode les images et les textes avec CLIP (vecteurs), tout se passe dans le navigateur. */
  function recLoad() {
    if (REC.engine) return Promise.resolve(REC.engine);
    if (REC.loading) return REC.loading;
    REC.loading = import(REC.lib).then(function (m) {
      m.env.allowLocalModels = false;
      var cb = { progress_callback: recProgress };
      return Promise.all([
        m.AutoProcessor.from_pretrained(REC.model, cb),
        m.CLIPVisionModelWithProjection.from_pretrained(REC.model, cb),
        m.AutoTokenizer.from_pretrained(REC.model, cb),
        m.CLIPTextModelWithProjection.from_pretrained(REC.model, cb)
      ]).then(function (x) {
        var proc = x[0], vis = x[1], tok = x[2], txt = x[3];
        return {
          image: function (url) {
            return m.RawImage.read(url).then(function (img) { return proc(img); })
              .then(function (inp) { return vis(inp); })
              .then(function (o) { return Array.prototype.slice.call(o.image_embeds.data); });
          },
          text: function (list) {
            var inp = tok(list, { padding: true, truncation: true });
            return Promise.resolve(txt(inp)).then(function (o) {
              var d = o.text_embeds.data, n = list.length, k = d.length / n, out = [];
              for (var i = 0; i < n; i++) out.push(Array.prototype.slice.call(d, i * k, (i + 1) * k));

    return REC.loading;
  }
  function vNorm(v) { var n = 0, i; for (i = 0; i < v.length; i++) n += v[i] * v[i]; n = Math.sqrt(n) || 1; return v.map(function (x) { return x / n; }); }
  function vDot(a, b) { var t = 0; for (var i = 0; i < a.length; i++) t += a[i] * b[i]; return t; }
  function vMean(list) { var o = list[0].map(function () { return 0; }); list.forEach(function (v) { v.forEach(function (x, i) { o[i] += x; }); }); return vNorm(o); }
  function softmax(arr, t) { var m = Math.max.apply(null, arr), e = arr.map(function (x) { return Math.exp(t * (x - m)); }), z = e.reduce(function (a, b) { return a + b; }, 0); return e.map(function (x) { return x / z; }); }
  /* Plusieurs formulations par animal : la moyenne est plus fiable qu'une seule phrase. */
  var TEMPLATES = ["a photo of {}.", "a close-up photo of {}, a wild animal.", "{} in the African savanna.", "a safari photo of {}."];
  function animalName(A) { var n = A.name.en.replace(/\s*\([^)]*\)\s*/g, " ").replace(/\s+/g, " ").trim(); return (/^[aeiou]/i.test(n) ? "an " : "a ") + n; }
  /* Vecteurs « de référence » : textes (animaux + intrus) et photos de l'appli. Calculés une fois, gardés sur l'appareil. */
  function recPrototypes(eng) {
    if (REC.protos) return Promise.resolve(REC.protos);
    var ids = Object.keys(D.animals), key = "saffrica-emb-" + REC.model + "-" + ids.length + "-" + Object.keys(window.APP_IMAGES || {}).length;
    try { var raw = localStorage.getItem(key); if (raw) { REC.protos = JSON.parse(raw); return Promise.resolve(REC.protos); } } catch (e) {}
    var texts = [], owner = [];
    ids.forEach(function (id) {
      var nm = animalName(D.animals[id]);
      TEMPLATES.forEach(function (t) { texts.push(t.replace("{}", nm)); owner.push(id); });
      if (D.animals[id].sci) { texts.push("a photo of " + D.animals[id].sci.replace(/\s*\([^)]*\)/g, "") + "."); owner.push(id); }
    });
    NOT_IN_APP.forEach(function (n) { TEMPLATES.slice(0, 2).forEach(function (t) { texts.push(t.replace("{}", n)); owner.push("#" + n); }); });
    return eng.text(texts).then(function (emb) {
      var groups = {};
      emb.forEach(function (v, i) { (groups[owner[i]] = groups[owner[i]] || []).push(vNorm(v)); });
      var protos = { text: {}, ref: {} };
      Object.keys(groups).forEach(function (k) { protos.text[k] = vMean(groups[k]); });
      var jobs = ids.filter(function (id) { return D.animals[id].img && window.APP_IMAGES && window.APP_IMAGES[D.animals[id].img]; });
      var chain = Promise.resolve();
      jobs.forEach(function (id) {
        chain = chain.then(function () { return eng.image(window.APP_IMAGES[D.animals[id].img]).then(function (v) { protos.ref[id] = vNorm(v); }); })
          .catch(function () {});
      });
      return chain.then(function () {
        REC.protos = protos;
        try { localStorage.setItem(key, JSON.stringify(protos, function (k, v) { return typeof v === "number" ? Math.round(v * 1e5) / 1e5 : v; })); } catch (e) {}
        return protos;
      });
    });
  }
  /* Décision : le texte dit « animal de l'appli ou pas », puis texte + photos de référence disent LEQUEL. */
  function recScore(imgVec, protos) {
    var v = vNorm(imgVec), keys = Object.keys(protos.text);
    var tp = softmax(keys.map(function (k) { return vDot(v, protos.text[k]); }), 100);
    var animalMass = 0, other = 0, byId = {};
    keys.forEach(function (k, i) { if (k.charAt(0) === "#") other += tp[i]; else { animalMass += tp[i]; byId[k] = tp[i]; } });
    var ids = Object.keys(byId), tN = {};
    ids.forEach(function (id) { tN[id] = animalMass ? byId[id] / animalMass : 0; });
    var refIds = Object.keys(protos.ref), rp = {};
    if (refIds.length) { var r = softmax(refIds.map(function (id) { return vDot(v, protos.ref[id]); }), 100); refIds.forEach(function (id, i) { rp[id] = r[i]; }); }
    var comb = {};
    ids.forEach(function (id) { comb[id] = refIds.length ? 0.5 * tN[id] + 0.5 * (rp[id] != null ? rp[id] : tN[id]) : tN[id]; });
    ids.sort(function (a, b) { return comb[b] - comb[a]; });
    return { ids: ids, comb: comb, animalMass: animalMass, other: other };
  }
  function recPrepare(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var k = Math.min(1, 448 / Math.max(img.width, img.height));
        var c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function (b) { b ? resolve(URL.createObjectURL(b)) : reject(new Error("blob")); }, "image/jpeg", 0.9);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("image")); };
      img.src = url;
    });
  }
  function recHandle(file) {
    if (!file) return;
    var shot = null, eng = null;
    var close = { label: T().camClose, fn: recHide };
    recShow({ title: T().camWork, bar: null, buttons: [] });
    recPrepare(file).then(function (url) {
      shot = url;
      recShow({ img: url, title: T().camLoading, text: T().camLoadingText, bar: 0, buttons: [] });
      return recLoad();
    }).then(function (e) {
      eng = e;
      recShow({ img: shot, title: T().camAnalyzing, buttons: [] });
      return recPrototypes(eng);
    }).then(function (protos) {
      return eng.image(shot).then(function (v) { return recScore(v, protos); });
    }).then(function (r) {
      REC.last = r;
      var top = r.ids[0];
      if (top && r.animalMass > r.other) { recHide(); location.hash = "#/a/" + top; return; }
      var hint = T().camNoneHint;
      var list = r.ids.slice(0, 3).map(function (i) { return tr(D.animals[i].name) + " " + Math.round(r.comb[i] * r.animalMass * 100) + " %"; });
      if (r.animalMass >= 0.1) hint += " " + T().camClosest + " " + list.join(", ") + ".";
      recShow({ img: shot, title: T().camNone, text: hint, buttons: [close] });
    }).catch(function (e) {
      recShow({ img: shot, title: T().camErrTitle, text: T().camErr + " (" + String((e && e.message) || e).slice(0, 160) + ")", buttons: [close] });
    });
  }
  REC.handle = recHandle;

  function bindHome() {
    ["camInput", "galInput"].forEach(function (nid) {
      var cam = document.getElementById(nid);
      if (cam) cam.addEventListener("change", function () {
        var f = cam.files && cam.files[0];
        cam.value = "";
        recHandle(f);
      });
    });
    var q = document.getElementById("q");
    if (!q) return;
    var res = document.getElementById("res");
    q.addEventListener("input", function () {
      var v = norm(q.value.trim());
      var shown = 0;
      Array.prototype.forEach.call(document.querySelectorAll("#items > li"), function (li) {
        var ok = !v || li.getAttribute("data-k").indexOf(v) >= 0;
        li.hidden = !ok;
        if (ok) shown++;
      });
      var html = v ? homeResults(v) : "";
      res.innerHTML = html;
      res.hidden = !html;
      var none = document.getElementById("none");
      if (none) none.hidden = shown > 0 || !!html;
    });
  }

  function bindFilter() {
    var q = document.getElementById("q");
    if (!q) return;
    q.addEventListener("input", function () {
      var v = norm(q.value.trim());
      var shown = 0;
      Array.prototype.forEach.call(document.querySelectorAll("#items > li"), function (li) {
        var ok = !v || li.getAttribute("data-k").indexOf(v) >= 0;
        li.hidden = !ok;
        if (ok) shown++;
      });
      var none = document.getElementById("none");
      if (none) none.hidden = shown > 0;
    });
  }

  function viewCountry(id) {
    var c = findCountry(id);
    if (!c) return viewCountries();
    var parks = D.parks.filter(function (p) { return p.country === id; });
    var html = "<h1>" + esc(countryName(c)) + "</h1>";
    if (!parks.length) {
      html += '<p class="lead">' + esc(T().noParks) + "</p>";
      return { html: html };
    }
    html += '<p class="lead">' + esc(T().pickParkLead) + "</p>" +
      '<ul class="list">' + parks.map(function (p) {
        return '<li><a class="row" href="#/p/' + p.id + '"><span><strong>' + esc(tr(p.name)) + "</strong><br><small class=\"meta\">" +
          esc(tr(p.region)) + '</small></span><span class="chev">›</span></a></li>';
      }).join("") + "</ul>";
    return { html: html };
  }

  function viewPark(id) {
    var p = findPark(id);
    if (!p) return viewCountries();
    var facts = p.facts.map(function (f) {
      return "<dt>" + esc(tr(f.label)) + "</dt><dd>" + esc(tr(f.value)) + "</dd>";
    }).join("");
    var tiles = p.animals.map(function (aid) {
      var a = D.animals[aid];
      return '<a class="tile ' + (isSeen(aid) ? "seen" : "unseen") + '" data-k="' + esc(norm(a.name.en + " " + a.name.fr + " " + a.sci)) + '" href="#/p/' + p.id + "/a/" + aid + '">' +
        photo(a) + '<span class="nm">' + esc(tr(a.name)) + "</span>" +
        '<span class="badge ' + a.status + '">' + esc(tr(D.status[a.status])) + "</span>" + gauge(a.status, "sm") + "</a>";
    }).join("");
    var nSeen = p.animals.filter(isSeen).length;
    var html = "<h1>" + esc(tr(p.name)) + '</h1><p class="meta">' + esc(tr(p.region)) + "</p>" +
      '<div class="card park"><p style="margin:0 0 8px">' + esc(tr(p.about)) + "</p>" +
      '<dl class="facts">' + facts + "</dl>" +
      '<p class="note"><strong>' + esc(T().bestTime) + ":</strong> " + esc(tr(p.bestTime)) + "</p>" +
      "<details><summary>" + esc(T().sources) + "</summary>" + sourceList(p.sources) + "</details></div>" +
      "<h2>" + esc(T().pickAnimal) + '</h2><p class="lead">' + esc(T().pickAnimalLead) + "</p>" +
      '<p class="meta seenline"><span><span class="sq g"></span>' + esc(T().seenG) + '</span><span><span class="sq r"></span>' + esc(T().seenR) + "</span><strong>" + nSeen + " / " + p.animals.length + " " + esc(T().seenCount) + "</strong></p>" +
      '<input class="search" id="q" type="search" placeholder="' + esc(T().search) + '" autocomplete="off">' +
      '<div class="grid" id="items">' + tiles + "</div>" +
      '<p class="empty" id="none" hidden>' + esc(T().noResults) + "</p>" +
      legendCard();
    return {
      html: html,
      after: function () {
        var q = document.getElementById("q");
        q.addEventListener("input", function () {
          var v = norm(q.value.trim());
          var shown = 0;
          Array.prototype.forEach.call(document.querySelectorAll("#items > a"), function (el) {
            var ok = !v || el.getAttribute("data-k").indexOf(v) >= 0;
            el.hidden = !ok;
            if (ok) shown++;
          });
          document.getElementById("none").hidden = shown > 0;
        });
      }
    };
  }

  function viewAnimal(pid, aid) {
    var p = pid ? findPark(pid) : null;
    var a = D.animals[aid];
    var pa = p && D.parkAnimals[pid] && D.parkAnimals[pid][aid];
    if (!a || (pid && (!p || !pa))) return viewCountries();

    var html = photo(a, "hero-photo") + (a.img ? '<p class="credit">' + esc(T().illustration) + "</p>" : "") + '<h1 style="margin:0">' + esc(tr(a.name)) + '</h1><p class="sci">' + esc(a.sci) + "</p>" +
      '<p class="meta">' + (p ? esc(tr(p.name)) + " · " + esc(T().stepNote) : esc(T().animalSheet)) + "</p>";

    /* 1. Infos générales sur l'animal (en haut) */
    html += '<section class="card"><h2>' + esc(T().about) + '</h2><dl class="facts">' +
      "<dt>" + esc(T().diet) + "</dt><dd>" + esc(tr(a.diet)) + "</dd>" +
      "<dt>" + esc(T().size) + "</dt><dd>" + esc(tr(a.size)) + "</dd>" +
      "<dt>" + esc(T().lifespan) + "</dt><dd>" + esc(tr(a.lifespan)) + "</dd>" +
      "<dt>" + esc(T().behavior) + "</dt><dd>" + esc(tr(a.behavior)) + "</dd>" +
      "</dl>" + recogBlock(a) + "</section>";

    /* 2. Dans ce parc  /  3. Dans le monde : exactement la même mise en page */
    if (pa) html += infoCard("park", T().inPark, tr(pa.pop),
      chip(T().conf[pa.conf], pa.conf) + (pa.trend ? chip(T().trend + ": " + tr(pa.trend)) : ""),
      looseDate(tr(pa.asOf)), tr(pa.note), pa.extra ? tr(pa.extra) : "");
    html += infoCard("world", T().worldwide, tr(a.global.pop),
      chip(tr(D.status[a.status]), a.status) + (a.global.trend ? chip(T().trend + ": " + tr(a.global.trend)) : ""),
      looseDate(a.global.asOf), tr(a.global.note), "");

    /* 4. Jauge de menace */
    html += '<section class="card"><h2>' + esc(T().status) + "</h2>" +
      '<p class="lvl"><span class="badge ' + a.status + '">' + esc(tr(D.status[a.status])) + "</span></p>" +
      gauge(a.status, "lg") +
      '<div class="scale"><span>' + esc(T().gaugeLess) + "</span><span>" + esc(T().gaugeMore) + "</span></div>" +
      '<p class="note">' + esc(tr(D.gauge[a.status].text)) + "</p>" +
      '<p class="meta">' + esc(tr(a.statusAsOf)) + "</p></section>";

    /* 5. Pays, parcs de l'application, où voir, sécurité, sources */
    html += rangeCard(aid);
    if (!p) {
      html += '<section class="card"><h2>' + esc(T().inApp) + "</h2>" + (parksWith(aid).length ? "" : '<p class="meta">' + esc(T().noPark) + "</p>") + '<ul class="list">' + parksWith(aid).map(function (pk) {
        var c = findCountry(pk.country);
        return '<li><a class="row" href="#/p/' + pk.id + "/a/" + aid + '"><span><strong>' + esc(tr(pk.name)) + '</strong><br><small class="meta">' +
          esc(c ? countryName(c) : "") + " · " + esc(T().seeHere) + '</small></span><span class="chev">›</span></a></li>';
      }).join("") + "</ul></section>";
    }
    if (pa) html += '<section class="card"><h2>' + esc(T().spot) + "</h2><p>" + esc(tr(pa.spot)) + "</p>" +
      '<p class="meta">' + esc(tr(p.bestTime)) + "</p></section>";
    html += '<section class="card"><h2>' + esc(T().safety) + "</h2><p>" + esc(tr(a.safety)) + "</p></section>";

    var rg = (D.ranges && D.ranges[aid] && D.ranges[aid].src) || [];
    var allSrc = uniq(((pa && pa.src) || []).concat((pa && pa.extraSrc) || [], (pa && pa.growthSrc) || [], (pa && pa.spotSrc) || [], a.global.src || [], a.statusSrc || [], rg));
    html += '<section class="card"><h2>' + esc(T().sources) + "</h2>" + sourceList(allSrc) + "</section>";
    html += '<div class="warn">' + esc(T().disclaimer) + "</div>";
    html += '<div class="seenpad"></div><button type="button" id="seenBtn" class="seenbtn' + (isSeen(aid) ? " on" : "") + '" aria-pressed="' + (isSeen(aid) ? "true" : "false") + '"><span class="dot"></span><span>' + esc(T().seenLbl) + "</span></button>";
    return { html: html, after: function () { bindSeen(aid); } };
  }

  function viewNews() {
    var html = "<h1>" + esc(T().whatsNew) + '</h1><p class="lead">' + esc(T().updatesLead) + "</p>" +
      D.updates.map(function (u) {
        return '<article class="card upd"><time datetime="' + esc(u.date) + '">' + esc(fmtDate(u.date)) + "</time>" +
          "<h2>" + esc(tr(u.title)) + "</h2><p>" + esc(tr(u.text)) + "</p>" + sourceList(u.src) + "</article>";
      }).join("");
    return { html: html };
  }

  /* ---------- router ---------- */
  function parse() {
    var h = (location.hash || "#/").replace(/^#\/?/, "");
    var parts = h.split("/").filter(Boolean);
    return parts;
  }

  function parentHash(parts) {
    if (parts[0] === "a") return "#/";
    if (parts[0] === "p" && parts[2] === "a") return "#/p/" + parts[1];
    if (parts[0] === "p") {
      var p = findPark(parts[1]);
      return p ? "#/c/" + p.country : "#/";
    }
    return "#/";
  }

  function render() {
    var parts = parse();
    var view;
    if (parts[0] === "c" && parts[1]) view = viewCountry(parts[1]);
    else if (parts[0] === "a" && parts[1]) view = viewAnimal(null, parts[1]);
    else if (parts[0] === "p" && parts[1] && parts[2] === "a" && parts[3]) view = viewAnimal(parts[1], parts[3]);
    else if (parts[0] === "p" && parts[1]) view = viewPark(parts[1]);
    else if (parts[0] === "news") view = viewNews();
    else view = viewCountries();

    app.innerHTML = view.html;
    if (view.after) view.after();

    var atHome = parts.length === 0;
    backBtn.hidden = atHome;
    backBtn.onclick = function () { location.hash = parentHash(parts); };
    backBtn.setAttribute("aria-label", T().back);

    document.documentElement.lang = lang;
    document.title = T().title;
    brand.textContent = T().title;
    langBtn.textContent = lang === "en" ? "FR" : "EN";
    langBtn.setAttribute("aria-label", lang === "en" ? "Passer en français" : "Switch to English");

    footer.innerHTML =
      '<p><a href="#/news">' + esc(T().whatsNew) + "</a></p>" +
      "<p>" + esc(T().checked) + ": " + esc(fmtDate(D.meta.lastChecked)) + " · " + esc(T().next) + ": " + esc(fmtDate(D.meta.nextUpdate)) + "</p>";

    window.scrollTo(0, 0);
  }

  langBtn.addEventListener("click", function () {
    lang = lang === "en" ? "fr" : "en";
    try { localStorage.setItem("awf-lang", lang); } catch (e) {}
    render();
  });
  window.addEventListener("hashchange", render);

  render();
})();

</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
